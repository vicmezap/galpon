<title>Galpón · MEZAP</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
/* =====================================================================
   La paleta es la misma de Retícula, para que Galpón se vea de la misma
   casa.  Lo único propio: el arriostre se dibuja en color de acento,
   porque de todo lo que hay en planta es lo único que no se ve en obra
   hasta que falta.
   ===================================================================== */
:root {
  --tinta:#1b2430; --tinta-2:#4a5568; --papel:#f2f1ec; --papel-2:#e6e4dc;
  --ficha:#fbfaf7; --linea:#cdcabd; --acero:#2f6f8f;
  --presion:#1d6a4f; --succion:#b4531a; --alerta:#8c2f39; --suave:#6b6f76;
  --disp:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --cuerpo:"IBM Plex Sans",system-ui,sans-serif;
  --cifra:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tinta:#e8e6df; --tinta-2:#b3b8c0; --papel:#14181d; --papel-2:#1c2128;
    --ficha:#1a1f26; --linea:#343b45; --acero:#79b8d4;
    --presion:#57c79a; --succion:#f0a35e; --alerta:#e58592; --suave:#8b929c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tinta:#e8e6df; --tinta-2:#b3b8c0; --papel:#14181d; --papel-2:#1c2128;
  --ficha:#1a1f26; --linea:#343b45; --acero:#79b8d4;
  --presion:#57c79a; --succion:#f0a35e; --alerta:#e58592; --suave:#8b929c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background:var(--papel); color:var(--tinta); font-family:var(--cuerpo);
  font-size:14px; line-height:1.45; margin:0; padding:0 0 40px; }
.env { max-width:1240px; margin:0 auto; padding-inline:16px; }

header.tapa { border-bottom:2px solid var(--tinta); padding-block:16px 10px; }
.marca { font-family:var(--disp); font-weight:600; font-size:clamp(22px,4vw,34px);
  letter-spacing:-0.01em; line-height:1.05; margin:0; }
.marca small { display:block; font-family:var(--cifra); font-size:10px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:var(--acero); margin-bottom:4px; }
.bajada { margin:8px 0 0; max-width:66ch; color:var(--tinta-2); font-size:13px; }
.sellos { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.sello { font-family:var(--cifra); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  border:1px solid var(--linea); border-radius:2px; padding:2px 6px; color:var(--tinta-2);
  background:var(--ficha); }
.sello b { color:var(--acero); font-weight:600; }

.reja { display:grid; grid-template-columns:290px minmax(0,1fr); gap:22px; margin-top:20px; }
@media (max-width:820px) { .reja { grid-template-columns:1fr; gap:16px; } }

fieldset { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  margin:0 0 10px; padding:10px 11px 12px; }
legend { font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--acero); padding:0 5px; }
.par { display:grid; grid-template-columns:1fr 92px; gap:6px 8px; align-items:center; margin-bottom:6px; }
.par:last-child { margin-bottom:0; }
.par label { font-size:12.5px; color:var(--tinta-2); min-width:0; }
.par input, .par select { font-family:var(--cifra); font-size:12.5px; width:100%;
  padding:3px 5px; border:1px solid var(--linea); border-radius:2px;
  background:var(--papel); color:var(--tinta); }
.par.ancho { grid-template-columns:1fr; }
input:focus-visible, select:focus-visible, button:focus-visible {
  outline:2px solid var(--acero); outline-offset:1px; }

/* ---- pestañas ---- */
nav.pestanas { display:flex; flex-wrap:wrap; gap:0; border-bottom:1px solid var(--linea);
  margin-bottom:14px; }
nav.pestanas button { font-family:var(--disp); font-size:13px; font-weight:600;
  letter-spacing:.03em; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--suave); padding:7px 12px; cursor:pointer; }
nav.pestanas button[aria-selected="true"] { color:var(--acero); border-bottom-color:var(--acero); }
nav.pestanas button:disabled { color:var(--linea); cursor:not-allowed; }

section.vista[hidden] { display:none; }

/* ---- el dibujo ---- */
.lienzo { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  padding:8px; margin-bottom:14px; }
.lienzo svg { display:block; width:100%; height:auto; }
.leyenda { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; font-size:11px;
  color:var(--suave); font-family:var(--cifra); }
.leyenda i { display:inline-block; width:16px; height:0; border-top-width:2px;
  border-top-style:solid; vertical-align:middle; margin-right:4px; }

/* ---- fichas ---- */
.fichas { display:grid; gap:12px; min-width:0; }
.ficha { border:1px solid var(--linea); border-left:3px solid var(--acero); border-radius:3px;
  background:var(--ficha); padding:11px 12px 12px; min-width:0; }
.ficha.mal { border-left-color:var(--alerta); }
.ficha.bien { border-left-color:var(--presion); }
.ficha > h2 { font-family:var(--disp); font-weight:600; font-size:15px; margin:0 0 2px; }
.ficha > .sub { font-family:var(--cifra); font-size:10px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--suave); margin:0 0 10px; }
.ln { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px;
  padding:6px 0; border-top:1px solid var(--papel-2); align-items:baseline; }
.ln:first-child { border-top:0; }
.ln .q { font-size:13px; min-width:0; }
.ln .v { font-family:var(--cifra); font-size:13.5px; font-variant-numeric:tabular-nums;
  white-space:nowrap; font-weight:500; }
.ln .v.ok { color:var(--presion); } .ln .v.no { color:var(--alerta); }
.ln p { grid-column:1/-1; margin:3px 0 0; font-size:11.5px; color:var(--suave); }

/* el botón que enseña la fila del inventario · la tesis del proyecto */
button.fte { font-family:var(--cifra); font-size:10px; letter-spacing:.05em;
  text-transform:uppercase; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--suave); padding:1px 5px; cursor:pointer; margin-left:6px; }
button.fte:hover { color:var(--acero); border-color:var(--acero); }
/* la procedencia de lo que NO es norma: se dice igual, sin boton */
.ln .org { font-family:var(--cifra); font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--linea); margin-left:6px; }

#fuente { position:fixed; inset:auto 0 0 0; background:var(--ficha);
  border-top:2px solid var(--acero); padding:12px 16px 14px; z-index:9;
  box-shadow:0 -4px 18px rgba(0,0,0,.14); max-height:52vh; overflow:auto; }
#fuente[hidden] { display:none; }
#fuente .env { position:relative; }
#fuente h3 { font-family:var(--disp); font-size:14px; margin:0 0 2px; }
#fuente .id { font-family:var(--cifra); font-size:10.5px; color:var(--acero);
  letter-spacing:.06em; }
#fuente dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:8px 0 0;
  font-size:12.5px; }
#fuente dt { font-family:var(--cifra); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--suave); }
#fuente dd { margin:0; }
#fuente .cerrar { position:absolute; top:-2px; right:0; background:none; border:0;
  font-size:20px; line-height:1; color:var(--suave); cursor:pointer; }

/* ---- problemas · los rechazos ---- */
#problemas[hidden] { display:none; }
#problemas { border:1px solid var(--alerta); border-left:3px solid var(--alerta);
  border-radius:3px; background:var(--ficha); padding:12px 13px; margin-bottom:14px; }
#problemas h2 { font-family:var(--disp); font-size:15px; margin:0 0 6px; color:var(--alerta); }
#problemas pre { font-family:var(--cifra); font-size:11.5px; white-space:pre-wrap;
  margin:0; color:var(--tinta-2); }
.nohay { color:var(--suave); font-size:13px; font-style:italic; padding:18px 2px; }

.aviso { border:1px solid var(--linea); border-left:3px solid var(--succion);
  border-radius:3px; background:var(--ficha); padding:11px 12px; font-size:12.5px;
  color:var(--tinta-2); }
.aviso b { color:var(--succion); }
</style>

<header class="tapa"><div class="env">
  <h1 class="marca"><small>MEZAP · Estructuras metálicas</small>Galpón</h1>
  <p class="bajada">Prediseño, análisis y diseño de galpones de acero.
    Cada número de esta pantalla tiene una fila en el inventario con su fuente,
    y se puede pedir pulsando <b>fuente</b>.</p>
  <div class="sellos" id="sellos"></div>
</div></header>

<div class="env">
<div class="reja">

  <form class="datos" id="f" autocomplete="off" onsubmit="return false"></form>

  <main>
    <nav class="pestanas" id="pestanas">
      <button type="button" data-v="portico" aria-selected="true">Pórtico</button>
      <button type="button" data-v="planta" aria-selected="false">Planta de techo</button>
      <button type="button" data-v="elev" aria-selected="false">Elevación longitudinal</button>
      <button type="button" data-v="tresd" aria-selected="false">3D</button>
    </nav>

    <div id="problemas" hidden><h2 id="problemas-t"></h2><pre id="problemas-p"></pre></div>

    <section class="vista" id="v-portico"></section>
    <section class="vista" id="v-planta" hidden></section>
    <section class="vista" id="v-elev" hidden></section>
    <section class="vista" id="v-tresd" hidden></section>
  </main>

</div>
</div>

<aside id="fuente" hidden><div class="env">
  <button class="cerrar" type="button" id="cerrar-fuente" aria-label="cerrar">×</button>
  <div class="id" id="fuente-id"></div>
  <h3 id="fuente-t"></h3>
  <dl id="fuente-dl"></dl>
</div></aside>

<script>
/*__MODULOS__*/
</script>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- sellos ---------- */
  (function () {
    var r = INVENTARIO.resumen();
    var s = [
      ["Inventario", r.total + " filas"],
      ["Verificado", r.verificado],
      ["Sin fuente", r.sin_fuente],
      ["Pendientes", r.pendiente],
      ["Perfiles", PERFILES.resumen().total],
      ["Calculables hoy", PERFILES.resumen().activos],
      ["Horneado", window.GALPON_FECHA || "—"]
    ];
    $("sellos").innerHTML = s.map(function (x) {
      return '<span class="sello">' + x[0] + ' <b>' + x[1] + '</b></span>';
    }).join("");
  })();

  /* ---------- LA TESIS: cualquier número puede enseñar su fila ----------
     No es decoración.  El proyecto entero se apoya en que ningún número
     entra sin fila en el inventario; si eso no se puede comprobar desde la
     pantalla, es una promesa que solo verifican las pruebas. */
  function fuenteBtn(id) {
    return '<button class="fte" type="button" data-fte="' + id + '">fuente</button>';
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button.fte") : null;
    if (!b) return;
    var t = INVENTARIO.todo(b.getAttribute("data-fte"));
    $("fuente-id").textContent = t.id + "  ·  " + t.estado;
    $("fuente-t").textContent = t.magnitud;
    var filas = [["Valor", t.valor + (t.unidad && t.unidad !== "—" ? " " + t.unidad : "")],
      ["Fuente", t.fuente], ["Sección", t.seccion]];
    if (t.nota) filas.push(["Nota", t.nota]);
    $("fuente-dl").innerHTML = filas.map(function (f) {
      return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>";
    }).join("");
    $("fuente").hidden = false;
  });
  $("cerrar-fuente").onclick = function () { $("fuente").hidden = true; };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function num(x, d) {
    return (Math.round(x * Math.pow(10, d)) / Math.pow(10, d))
      .toFixed(d).replace(".", ",");
  }
  function lista(s) {
    return String(s || "").split(/[,;\s]+/).filter(function (x) { return x !== ""; })
      .map(Number).filter(function (x) { return !isNaN(x); });
  }

  /* ---------- EL DIBUJO ----------
     Una sola rutina para las tres vistas: cambia la proyección y ya.  El
     arriostre va en color de acento porque es lo único del dibujo que no
     se ve en obra hasta que falta. */
  var COLOR = {
    "columna": "var(--tinta)", "columna hastial": "var(--tinta-2)",
    "brida superior": "var(--tinta)", "brida inferior": "var(--tinta)",
    "diagonal": "var(--tinta-2)", "montante": "var(--tinta-2)",
    "correa": "var(--suave)", "viga de alero": "var(--suave)",
    "arriostre de techo": "var(--succion)", "arriostre de fachada": "var(--succion)"
  };
  var GRUESO = {
    "columna": 2.2, "columna hastial": 1.6, "brida superior": 2, "brida inferior": 2,
    "arriostre de techo": 1.8, "arriostre de fachada": 1.8
  };

  function dibuja(nudos, barras, px, py, alto, orden, opacidad) {
    var pos = {}, i;
    for (i = 0; i < nudos.length; i++) pos[nudos[i].id] = nudos[i];
    var xs = [], ys = [];
    for (i = 0; i < nudos.length; i++) { xs.push(px(nudos[i])); ys.push(py(nudos[i])); }
    if (!xs.length) return '<p class="nohay">nada que dibujar</p>';
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var w = Math.max(x1 - x0, 1e-6), h = Math.max(y1 - y0, 1e-6);
    var W = 1000, m = 26;
    var k = (W - 2 * m) / w;
    var H = h * k + 2 * m;
    if (alto && H > alto) { k = (alto - 2 * m) / h; H = alto; }
    var X = function (n) { return m + (px(n) - x0) * k; };
    var Y = function (n) { return H - m - (py(n) - y0) * k; };

    var out = ['<svg viewBox="0 0 ' + W + ' ' + Math.round(H) +
      '" preserveAspectRatio="xMidYMid meet" role="img">'];

    /* EN QUE ORDEN SE PINTA. Si la vista trae su propio orden —la 3D, de
       atras hacia delante, fila V.profundidad— manda ese. Si no, el
       arriostre va encima de todo, que es lo que hay que ver en planta. */
    var cola;
    if (orden && orden.length) {
      var porId = {};
      for (i = 0; i < barras.length; i++) porId[barras[i].id] = barras[i];
      cola = [];
      for (i = 0; i < orden.length; i++) if (porId[orden[i]]) cola.push(porId[orden[i]]);
    } else {
      cola = barras.slice().sort(function (a, b) {
        var pa = /arriostre/.test(a.clase) ? 1 : 0, pb = /arriostre/.test(b.clase) ? 1 : 0;
        return pa - pb;
      });
    }

    for (i = 0; i < cola.length; i++) {
      var b = cola[i], a = pos[b.i], c = pos[b.j];
      if (!a || !c) continue;
      var op = (opacidad && opacidad[b.id] !== undefined) ? opacidad[b.id] : 1;
      out.push('<line x1="' + X(a).toFixed(1) + '" y1="' + Y(a).toFixed(1) +
        '" x2="' + X(c).toFixed(1) + '" y2="' + Y(c).toFixed(1) +
        '" stroke="' + (COLOR[b.clase] || "var(--tinta-2)") +
        '" stroke-width="' + (GRUESO[b.clase] || 1.1) + '"' +
        (op < 1 ? ' stroke-opacity="' + op.toFixed(3) + '"' : "") +
        ' stroke-linecap="round"/>');
    }
    out.push("</svg>");
    return out.join("");
  }

  function leyenda(pares) {
    return '<div class="leyenda">' + pares.map(function (p) {
      return '<span><i style="border-top-color:' + p[1] + '"></i>' + p[0] + '</span>';
    }).join("") + "</div>";
  }

  /* ---------- EL FORMULARIO, DECLARADO EN vistas.js ---------- */
  (function pintaFormulario() {
    $("f").innerHTML = VISTAS.grupos().map(function (g) {
      return "<fieldset><legend>" + esc(g.nombre) + "</legend>" +
        g.campos.map(campo).join("") + "</fieldset>";
    }).join("");
  })();

  function campo(c) {
    var et = esc(c.etiqueta) + (c.unidad ? " (" + esc(c.unidad) + ")" : "") +
      (c.fuente ? fuenteBtn(c.fuente) : "");
    var cid = "c_" + c.id;
    if (c.tipo === "si/no") {
      return '<div class="par ancho"><label class="marca-check" style="display:flex;gap:7px;align-items:center">' +
        '<input type="checkbox" style="width:auto" id="' + cid + '"' +
        (c.valor ? " checked" : "") + '><span style="font-size:12.5px;color:var(--tinta-2)">' +
        et + "</span></label></div>";
    }
    if (c.tipo === "opcion") {
      return '<div class="par ancho"><label for="' + cid + '">' + et +
        '</label><select id="' + cid + '">' + c.opciones.map(function (o) {
          return '<option value="' + o[0] + '"' +
            (o[0] === c.valor ? " selected" : "") + ">" + esc(o[1]) + "</option>";
        }).join("") + "</select></div>";
    }
    if (c.tipo === "lista") {
      return '<div class="par ancho"><label for="' + cid + '">' + et +
        '</label><input type="text" id="' + cid + '" value="' + esc(c.valor) +
        '" placeholder="' + esc(c.ayuda || "") + '"></div>';
    }
    var r = c.limiteDePantalla || [];
    return '<div class="par"><label for="' + cid + '">' + et +
      '</label><input type="number" id="' + cid + '" value="' + c.valor +
      '" step="' + c.paso + '"' +
      (r.length ? ' min="' + r[0] + '" max="' + r[1] + '"' : "") + "></div>";
  }

  /* ---------- EL CALCULO, Y EL RECHAZO ----------
     Las guardas del motor LANZAN, y aqui no se ablandan: se ensena el
     mensaje entero y NO se dibuja nada (filas V.no.duplica y V.procedencia).
     Pintar el galpon «de todas formas» con un aviso al lado seria
     exactamente lo que el motor se niega a hacer, por la puerta de atras. */
  function datos() {
    var d = {}, i, c, el;
    for (i = 0; i < VISTAS.ENTRADAS.length; i++) {
      c = VISTAS.ENTRADAS[i];
      el = $("c_" + c.id);
      if (c.tipo === "si/no") d[c.id] = !!(el && el.checked);
      else if (c.tipo === "numero") d[c.id] = el ? +el.value : NaN;
      else d[c.id] = el ? el.value : "";
    }
    return d;
  }

  function paraElMotor(d) {
    var at = lista(d.at), af = lista(d.af);
    return {
      luz_m: d.luz, largo_m: d.largo, sepPorticos_m: d.sep,
      alturaColumna_m: d.hcol, ajustaSeparacion: d.ajusta,
      cuerdas: d.cuerdas, alma: d.alma,
      pendiente: d.pend / 100, pendienteInferior: d.pendi / 100,
      paneles: d.pan, peralteApoyo_m: d.h0,
      panosArriostradosTecho: at,
      panosArriostradosFachada: af.length ? af : at,
      columnasHastiales: lista(d.ch)
    };
  }

  /* ---------- EL PINTOR, QUE NO DECIDE NADA ----------
     Recibe {q, v, origen, fuente} de vistas.js y lo dibuja.  Si una linea
     dice venir de norma, lleva su boton; si no, lleva su procedencia escrita
     y NO lleva boton.  No es estilo: el boton es la diferencia entre una
     cifra avalada y una cifra en negrita (fila V.procedencia). */
  var ETIQUETA = {
    norma: "", entrada: "dato", geometria: "geometria",
    conteo: "conteo", medido: "medido"
  };

  function pintaLinea(l) {
    var marca = (l.origen === "norma")
      ? fuenteBtn(l.fuente)
      : '<span class="org">' + ETIQUETA[l.origen] + "</span>";
    return '<div class="ln"><span class="q">' + esc(l.q) + marca +
      '</span><span class="v' + (l.estado ? " " + l.estado : "") + '">' +
      esc(l.v) + "</span>" +
      (l.nota ? "<p>" + esc(l.nota) + "</p>" : "") + "</div>";
  }

  function pintaFicha(f) {
    return '<div class="ficha' + (f.estado ? " " + f.estado : "") + '"><h2>' +
      esc(f.titulo) + '</h2><p class="sub">' + esc(f.sub) + "</p>" +
      f.lineas.map(pintaLinea).join("") + "</div>";
  }

  var TINTA = {
    tinta: "var(--tinta)", "tinta-2": "var(--tinta-2)",
    suave: "var(--suave)", succion: "var(--succion)", linea: "var(--linea)"
  };

  function pintaVista(p, m3, vista) {
    if (!p.real) {
      return '<div class="aviso"><b>Todavia no.</b> ' + esc(p.porque) + "</div>";
    }
    var d = VISTAS.dibujo(p.id, m3, vista);
    var svg = dibuja(d.nudos, d.barras,
      function (n) { return n[d.ejeX]; },
      function (n) { return n[d.ejeY]; }, 520, d.orden, d.opacidad);
    var ley = '<div class="leyenda">' + d.leyenda.map(function (x) {
      return '<span><i style="border-top-color:' + (TINTA[x[1]] || x[1]) +
        '"></i>' + esc(x[0]) + "</span>";
    }).join("") + "</div>";
    return '<div class="lienzo">' + svg + ley + "</div>" +
      '<div class="fichas">' + VISTAS.fichas(p.id, m3, vista).map(pintaFicha).join("") + "</div>";
  }

  function recalcula() {
    var d = datos();
    var v = VISTAS.valida(d);
    var m3 = null, fallo = null, i, p;

    if (!v.ok) {
      fallo = {
        titulo: "Hay campos que no se pueden leer",
        mensaje: v.malos.map(function (m) {
          return "  - " + m.etiqueta + ": " + m.que +
            (m.limiteDePantalla ? "\n" + "      (tope de pantalla, no criterio de diseno)" : "");
        }).join("\n"),
        porQueNoSeDibuja: "Esto solo comprueba la FORMA. Las reglas de diseno las " +
          "comprueba el motor, y no se copian aqui."
      };
    } else {
      try { m3 = MONTAJE.monta(paraElMotor(VISTAS.datosModelo(d))); }
      catch (e) { fallo = VISTAS.problema(e); }
    }

    if (fallo) {
      $("problemas-t").textContent = fallo.titulo;
      $("problemas-p").textContent = fallo.mensaje + "\n" + "\n" + fallo.porQueNoSeDibuja;
      $("problemas").hidden = false;
      var vacio = '<p class="nohay">' + esc(fallo.porQueNoSeDibuja) + "</p>";
      for (i = 0; i < VISTAS.PESTANAS.length; i++) {
        p = VISTAS.PESTANAS[i];
        $("v-" + p.id).innerHTML = p.real ? vacio : pintaVista(p, null, null);
      }
      return;
    }

    $("problemas").hidden = true;
    var vista = VISTAS.datosVista(d);
    for (i = 0; i < VISTAS.PESTANAS.length; i++) {
      p = VISTAS.PESTANAS[i];
      $("v-" + p.id).innerHTML = pintaVista(p, m3, vista);
    }
  }

  /* ---------- pestañas ---------- */
  var IDS = VISTAS.PESTANAS.map(function (p) { return p.id; });
  $("pestanas").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-v]") : null;
    if (!b) return;
    var v = b.getAttribute("data-v"), i;
    for (i = 0; i < IDS.length; i++) {
      $("v-" + IDS[i]).hidden = (IDS[i] !== v);
    }
    var bs = $("pestanas").querySelectorAll("button[data-v]");
    for (i = 0; i < bs.length; i++) {
      bs[i].setAttribute("aria-selected", bs[i] === b ? "true" : "false");
    }
  });

  /* ---------- recálculo ---------- */
  $("f").addEventListener("input", recalcula);
  $("f").addEventListener("change", recalcula);
  recalcula();

  /* ---------- Office ----------
     La página funciona igual sin Excel: Office.js solo añade poder volcar.
     Si no hay Office, no pasa nada y no se avisa de nada, porque abrir esto
     en un navegador es un uso legítimo y no un error. */
  if (typeof Office !== "undefined" && Office.onReady) {
    Office.onReady(function () { document.body.setAttribute("data-office", "1"); });
  }
})();
</script>
