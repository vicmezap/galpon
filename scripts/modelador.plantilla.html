<title>Galpón · modelador</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root {
  --tinta:#1b2430; --tinta-2:#4a5568; --papel:#f2f1ec; --papel-2:#e6e4dc;
  --ficha:#fbfaf7; --linea:#cdcabd; --acero:#2f6f8f;
  --ok:#1d6a4f; --aviso:#b4531a; --alerta:#8c2f39; --suave:#6b6f76;
  --disp:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --cuerpo:"IBM Plex Sans",system-ui,sans-serif;
  --cifra:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --tinta:#e8e6df; --tinta-2:#b3b8c0; --papel:#14181d; --papel-2:#1c2128;
  --ficha:#1a1f26; --linea:#343b45; --acero:#79b8d4;
  --ok:#57c79a; --aviso:#f0a35e; --alerta:#e58592; --suave:#8b929c;
  color-scheme: dark; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--papel); color:var(--tinta); font-family:var(--cuerpo);
  font-size:13.5px; line-height:1.4; margin:0; display:flex; flex-direction:column; }

/* ---- cabecera ---- */
header { border-bottom:2px solid var(--tinta); padding:10px 16px 8px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
header h1 { font-family:var(--disp); font-weight:600; font-size:24px; margin:0;
  letter-spacing:-0.01em; }
.chip { font-family:var(--cifra); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; border:1px solid var(--linea); border-radius:2px;
  padding:2px 6px; color:var(--tinta-2); background:var(--ficha); }
.chip.a { border-color:var(--acero); color:var(--acero); }
header .lema { color:var(--tinta-2); font-size:12.5px; flex:1; min-width:160px; }
header .der { display:flex; gap:7px; align-items:center; }
button.h { font-family:var(--cuerpo); font-size:12.5px; padding:6px 12px;
  border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  color:var(--tinta); cursor:pointer; }
button.h.pri { background:var(--acero); border-color:var(--acero); color:#fff;
  font-weight:600; }
button.h:hover { border-color:var(--acero); }

/* OCULTO ES OCULTO. Una regla de autor con display:flex le gana al
   [hidden] del navegador, y la barra de vistas se seguia viendo en Cargas
   con el atributo puesto. Esta regla va primero y con !important a
   proposito: es la unica manera de que hidden signifique lo que dice. */
[hidden] { display:none !important; }

/* ---- barra de pasos ---- */
nav.pasos { border-bottom:1px solid var(--linea); padding:7px 16px 0;
  display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; }
.grupo { display:flex; flex-direction:column; gap:3px; }
.grupo > span { font-family:var(--cifra); font-size:8.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--suave); }
.grupo > div { display:flex; }
nav.pasos button { font-family:var(--disp); font-size:12.5px; font-weight:600;
  letter-spacing:.02em; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--suave); padding:5px 10px 7px; cursor:pointer; white-space:nowrap; }
nav.pasos button[aria-selected="true"] { color:var(--acero); border-bottom-color:var(--acero); }
nav.pasos button .ins { font-family:var(--cifra); font-size:9px; background:var(--aviso);
  color:#fff; border-radius:8px; padding:0 5px; margin-left:5px; vertical-align:1px; }
nav.pasos button.falta { color:var(--linea); }

/* ---- vistas + métricas ---- */
nav.vistas { border-bottom:1px solid var(--linea); padding:0 16px; display:flex;
  gap:0; align-items:center; }
nav.vistas button { font-family:var(--disp); font-size:12.5px; font-weight:600;
  background:none; border:0; border-bottom:2px solid transparent; color:var(--suave);
  padding:7px 12px; cursor:pointer; }
nav.vistas button[aria-selected="true"] { color:var(--tinta); border-bottom-color:var(--tinta); }

.metricas { display:flex; gap:0; flex-wrap:wrap; border-bottom:1px solid var(--linea);
  background:var(--ficha); }
.metricas > div { padding:6px 14px; border-right:1px solid var(--papel-2);
  display:flex; gap:7px; align-items:baseline; }
.metricas .k { font-family:var(--cifra); font-size:9px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--suave); }
.metricas .n { font-family:var(--cifra); font-size:13px; font-weight:500;
  font-variant-numeric:tabular-nums; }
.metricas select { font-family:var(--cifra); font-size:12px; border:1px solid var(--linea);
  border-radius:2px; background:var(--papel); color:var(--tinta); padding:1px 4px; }
.metricas .pasada .n { color:var(--acero); }

/* ---- la reja de trabajo ---- */
.obra { flex:1; display:grid; grid-template-columns:210px minmax(0,1fr) 300px;
  min-height:0; }
/* LA REJA LA ELIGE EL PASO. Con tres columnas fijas, ocultar los lados
   dejaba el centro en la primera -la de 210 px- y todo salia apretado a la
   izquierda con la pantalla vacia al lado. Sin lado, sin su columna. */
.obra.sin-izq { grid-template-columns:minmax(0,1fr) 300px; }
.obra.sin-der { grid-template-columns:210px minmax(0,1fr); }
.obra.sin-izq.sin-der { grid-template-columns:minmax(0,1fr); }
@media (max-width:1100px) { .obra { grid-template-columns:180px minmax(0,1fr); }
  .obra > aside.der { display:none; }
  .obra.sin-izq { grid-template-columns:minmax(0,1fr); } }
.obra > * { overflow:auto; min-width:0; }
aside.izq { border-right:1px solid var(--linea); padding:10px 11px 24px; }
aside.der { border-left:1px solid var(--linea); padding:10px 12px 24px;
  background:var(--ficha); }
main.lienzo { padding:10px 12px; display:flex; flex-direction:column; }

h3.sec { font-family:var(--cifra); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--suave); margin:0 0 7px; font-weight:500; }
h3.sec + h3.sec { margin-top:16px; }

/* capas · ver y aislar */
.capas { margin-bottom:6px; }
.capa { display:grid; grid-template-columns:16px 1fr auto auto; gap:6px;
  align-items:center; padding:3px 4px; border-radius:2px; font-size:12px; }
.capa:hover { background:var(--papel-2); }
.capa.aislada { background:var(--papel-2); outline:1px solid var(--acero); }
.capa.apagada { opacity:.45; }
.capa i { width:12px; height:0; border-top-width:3px; border-top-style:solid; }
.capa .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.capa .n { font-family:var(--cifra); font-size:10.5px; color:var(--suave);
  font-variant-numeric:tabular-nums; }
.capa button.ais { font-family:var(--cifra); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--suave); padding:0 4px; cursor:pointer; }
.capa button.ais:hover, .capa.aislada button.ais { color:var(--acero);
  border-color:var(--acero); }
.capa input { margin:0; }
.resumen { font-family:var(--cifra); font-size:10px; color:var(--suave);
  border-top:1px solid var(--papel-2); padding-top:5px; margin-bottom:14px; }
.resumen b { color:var(--acero); }

/* parámetros */
fieldset { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  margin:0 0 9px; padding:8px 9px 9px; }
legend { font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--acero); padding:0 4px; }
.par { display:grid; grid-template-columns:1fr 70px; gap:4px 6px; align-items:center;
  margin-bottom:5px; }
.par.ancho { grid-template-columns:1fr; }
.par label { font-size:11.5px; color:var(--tinta-2); }
.par input, .par select { font-family:var(--cifra); font-size:11.5px; width:100%;
  padding:2px 4px; border:1px solid var(--linea); border-radius:2px;
  background:var(--papel); color:var(--tinta); }
.marca-check { display:flex; gap:6px; align-items:center; }
.marca-check input { width:auto; }

/* lienzo */
.marco { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  padding:8px; flex:1; display:flex; flex-direction:column; min-height:260px;
  position:relative; }
.zoom { position:absolute; top:10px; right:12px; display:flex; gap:2px; z-index:2; }
.cubo { position:absolute; top:10px; left:12px; display:flex; gap:2px; z-index:2; }
.cubo button { font-family:var(--disp); font-size:11px; font-weight:600; padding:3px 9px;
  border:1px solid var(--linea); background:var(--papel); color:var(--tinta-2);
  cursor:pointer; border-radius:2px; }
.cubo button[aria-pressed="true"] { background:var(--acero); border-color:var(--acero);
  color:#fff; }
.cubo button:hover { border-color:var(--acero); }
.medible { position:absolute; top:40px; left:12px; z-index:2; font-family:var(--cifra);
  font-size:10px; padding:2px 7px; border-radius:2px; }
.medible.si { color:var(--ok); border:1px solid var(--ok); background:var(--papel); }
.medible.no { color:var(--alerta); border:1px solid var(--alerta); background:var(--papel);
  cursor:pointer; }
.zoom button { font-family:var(--cifra); font-size:13px; width:26px; height:24px;
  border:1px solid var(--linea); background:var(--papel); color:var(--tinta);
  cursor:pointer; border-radius:2px; line-height:1; }
.zoom button:hover { border-color:var(--acero); color:var(--acero); }
.escala { position:absolute; bottom:12px; left:14px; font-family:var(--cifra);
  font-size:10px; color:var(--suave); }
text.cota { font-family:var(--cifra); font-size:11px; fill:var(--tinta-2); }
text.etiq { font-family:var(--cifra); font-size:10px; fill:var(--suave); }
text.ejeN { font-family:var(--cifra); font-size:11px; fill:var(--acero);
  font-weight:600; }
text.marca { font-family:var(--cifra); font-size:10px; fill:var(--aviso);
  letter-spacing:.06em; }
line.toca { stroke:transparent; stroke-width:9; cursor:pointer; }
.marco.orbitable svg { cursor:grab; }
.marco.orbitando svg, .marco.encuadrando svg { cursor:grabbing; }
.pista { position:absolute; bottom:12px; right:14px; font-family:var(--cifra);
  font-size:10px; color:var(--suave); }
.marco svg { display:block; width:100%; height:auto; }
.leyenda { display:flex; flex-wrap:wrap; gap:11px; margin-top:7px; font-size:10.5px;
  color:var(--suave); font-family:var(--cifra); }
.leyenda i { display:inline-block; width:15px; border-top-width:2px;
  border-top-style:solid; vertical-align:middle; margin-right:4px; }

/* tablas del panel derecho */
table.t { width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:4px; }
table.t th { font-family:var(--cifra); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--suave); font-weight:500; text-align:left;
  padding:3px 4px; border-bottom:1px solid var(--linea); }
table.t td { padding:2px 4px; border-bottom:1px solid var(--papel-2);
  vertical-align:middle; }
table.t td.n { font-family:var(--cifra); text-align:right;
  font-variant-numeric:tabular-nums; color:var(--suave); }
table.t td.c { text-align:center; }
table.t input[type=text] { width:100%; font-family:var(--cifra); font-size:11px;
  padding:1px 3px; border:1px solid var(--linea); border-radius:2px;
  background:var(--papel); color:var(--tinta); }
table.t input.malo { border-color:var(--alerta); color:var(--alerta); }
table.t input.vacio { border-style:dashed; }
table.t tr.sel td { background:var(--papel-2); }
.pie { font-size:10.5px; color:var(--suave); margin:2px 0 12px; }
.pie.mal { color:var(--aviso); }

/* panel derecho */
.ln { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 9px;
  padding:5px 0; border-top:1px solid var(--papel-2); align-items:baseline; }
.ln:first-child { border-top:0; }
.ln .q { font-size:12px; }
.ln .v { font-family:var(--cifra); font-size:12.5px; font-variant-numeric:tabular-nums;
  white-space:nowrap; font-weight:500; }
.ln .v.ok { color:var(--ok); } .ln .v.no { color:var(--alerta); }
.ln p { grid-column:1/-1; margin:2px 0 0; font-size:10.5px; color:var(--suave); }
.ln .org { font-family:var(--cifra); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--linea); margin-left:5px; }
button.fte { font-family:var(--cifra); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--suave); padding:0 4px; cursor:pointer; margin-left:5px; }
button.fte:hover { color:var(--acero); border-color:var(--acero); }
.tarj { border:1px solid var(--linea); border-left:3px solid var(--acero);
  border-radius:3px; background:var(--papel); padding:9px 10px; margin-bottom:11px; }
.tarj.bien { border-left-color:var(--ok); }
.tarj > h4 { font-family:var(--disp); font-size:13.5px; margin:0 0 1px; }
.tarj > .sub { font-family:var(--cifra); font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--suave); margin:0 0 7px; }

/* avisos · las guardas */
.guarda { border:1px solid var(--aviso); border-left:3px solid var(--aviso);
  border-radius:3px; background:var(--papel); padding:9px 10px; margin-bottom:9px; }
.guarda b { color:var(--aviso); font-size:12px; }
.guarda pre { font-family:var(--cifra); font-size:10.5px; white-space:pre-wrap;
  margin:4px 0 0; color:var(--tinta-2); }

.nohay { color:var(--suave); font-style:italic; font-size:12.5px; padding:14px 2px; }
.todavia { border:1px solid var(--linea); border-left:3px solid var(--aviso);
  border-radius:3px; background:var(--ficha); padding:13px 15px; font-size:13px;
  color:var(--tinta-2); max-width:70ch; }
.todavia b { color:var(--aviso); }
/* ---- EL TABLERO Y LA LISTA DE AVISOS · los pasos que no llevan dibujo
   no llevan lienzo: llevan pagina, y una pagina quiere ancho ---- */
.hoja { padding:20px 26px 40px; overflow:auto; max-width:1180px; width:100%;
  margin:0 auto; box-sizing:border-box; }
/* una pagina sin lados NO se pega a la izquierda: va centrada, y el aviso de
   «todavia no» ocupa su ancho en vez de quedarse en una columna estrecha */
.hoja .todavia { max-width:none; }
.hoja > h2 { font-family:var(--disp); font-size:19px; font-weight:600;
  margin:0 0 3px; letter-spacing:-.01em; }
.hoja > p.lead { color:var(--suave); font-size:12.5px; margin:0 0 18px; }
.rejilla { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(265px,1fr)); }
.rejilla .tarj { margin:0; }
ol.avisos { list-style:none; margin:0; padding:0; }
ol.avisos li { border:1px solid var(--linea); border-left:3px solid var(--linea);
  border-radius:2px; padding:9px 12px 10px; margin-bottom:8px; }
ol.avisos li.error { border-left-color:var(--alerta); }
ol.avisos li.aviso { border-left-color:var(--aviso); }
ol.avisos li.nota  { border-left-color:var(--suave); }
ol.avisos .niv { font-family:var(--cifra); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; margin-right:8px; }
ol.avisos li.error .niv { color:var(--alerta); }
ol.avisos li.aviso .niv { color:var(--aviso); }
ol.avisos li.nota  .niv { color:var(--suave); }
ol.avisos b { font-family:var(--disp); font-size:13px; font-weight:600; }
ol.avisos p { margin:5px 0 0; font-size:12.5px; color:var(--tinta-2);
  line-height:1.5; max-width:76ch; }
ol.avisos .cuales { font-family:var(--cifra); font-size:10.5px; color:var(--suave);
  margin-top:4px; }
ol.avisos .ir { font-family:var(--disp); font-size:11px; font-weight:600;
  margin-top:7px; padding:2px 8px; border:1px solid var(--linea);
  background:var(--papel); color:var(--acero); cursor:pointer; border-radius:2px; }
ol.avisos .ir:hover { border-color:var(--acero); }
.cuenta { display:flex; gap:7px; margin:0 0 16px; }
.cuenta span { font-family:var(--cifra); font-size:10px; padding:3px 9px;
  border:1px solid var(--linea); border-radius:2px; }
.cuenta span.e { color:var(--alerta); border-color:var(--alerta); }
.cuenta span.a { color:var(--aviso); border-color:var(--aviso); }
.cuenta span.ok { color:var(--ok); border-color:var(--ok); }
.todavia code { font-family:var(--cifra); font-size:.92em; }
#fuente { position:fixed; inset:auto 0 0 0; background:var(--ficha);
  border-top:2px solid var(--acero); padding:11px 16px 13px; z-index:9;
  box-shadow:0 -4px 18px rgba(0,0,0,.16); max-height:48vh; overflow:auto; }
#fuente[hidden] { display:none; }
#fuente .id { font-family:var(--cifra); font-size:10px; color:var(--acero);
  letter-spacing:.06em; }
#fuente h5 { font-family:var(--disp); font-size:13.5px; margin:1px 0 5px; }
#fuente dl { display:grid; grid-template-columns:auto 1fr; gap:2px 11px; margin:0;
  font-size:12px; }
#fuente dt { font-family:var(--cifra); font-size:9.5px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--suave); }
#fuente dd { margin:0; }
#fuente button { position:absolute; top:6px; right:14px; background:none; border:0;
  font-size:19px; color:var(--suave); cursor:pointer; }
</style>

<header>
  <h1>Galpón</h1>
  <span class="chip">Prototipo · panel de Excel</span>
  <span class="chip a" id="build">—</span>
  <span class="lema">Define el galpón entero. El cálculo se queda en las hojas.</span>
  <span class="der">
    <button class="h" id="b-descartar">Cerrar sin guardar</button>
    <button class="h pri" id="b-guardar">Guardar y cerrar</button>
  </span>
</header>

<nav class="pasos" id="pasos"></nav>
<nav class="vistas" id="vistas"></nav>
<div class="metricas" id="metricas"></div>

<div class="obra" id="obra">
  <aside class="izq" id="izquierda">
    <div id="lado-ver">
      <h3 class="sec">Ver</h3>
      <div class="capas" id="capas"></div>
      <div class="resumen" id="resumen"></div>
    </div>
    <div id="lado-parametros">
      <h3 class="sec">Datos</h3>
      <form id="f" autocomplete="off" onsubmit="return false"></form>
    </div>
  </aside>
  <main class="lienzo" id="centro"></main>
  <aside class="der" id="derecha"></aside>
</div>

<aside id="fuente" hidden>
  <button type="button" id="cerrar-fuente" aria-label="cerrar">×</button>
  <div class="id" id="fuente-id"></div>
  <h5 id="fuente-t"></h5>
  <dl id="fuente-dl"></dl>
</aside>

<script>
/*__MODULOS__*/
</script>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var BUILD = window.GALPON_BUILD || "—";
  $("build").textContent = BUILD;

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function n2(x, d) {
    d = d === undefined ? 2 : d;
    return (Math.round(x * Math.pow(10, d)) / Math.pow(10, d))
      .toFixed(d).replace(".", ",");
  }
  function lista(s) {
    return String(s || "").split(/[,;\s]+/).filter(function (x) { return x !== ""; })
      .map(Number).filter(function (x) { return !isNaN(x); });
  }

  /* ---------- LOS PASOS Y SU ARMAZON ----------

     ESTABA MAL Y SE VEIA. La barra de vistas -Portico, Planta, Elevacion,
     3D- y el panel de la izquierda -Ver y Datos- son de GEOMETRIA, y se
     colaban en los once pasos. Al entrar en Cargas seguias viendo las
     capas de barras y los parametros del tijeral, que alli no pintan nada:
     el armazon de un paso parecia el de todos porque era el de todos.

     Y la lista de pasos estaba AQUI, a mano, duplicada de vistas.js: dos
     copias de la misma lista en dos archivos es la que se desincroniza.
     Ahora la lista y el armazon de cada paso salen del modulo, que es
     donde se pueden comprobar sin abrir un navegador. */
  var PASOS = VISTAS.PASOS;
  var pasoActivo = "geom";
  var insignia = null;

  function pintaPasos() {
    var html = "", grupo = null, abierto = false;
    PASOS.forEach(function (p) {
      if (p.grupo !== grupo) {
        if (abierto) html += "</div></div>";
        html += '<div class="grupo"><span>' + esc(p.grupo) + "</span><div>";
        grupo = p.grupo; abierto = true;
      }
      var ins = (p.id === "comprob" && insignia) ?
        '<span class="ins">' + insignia + "</span>" : "";
      html += '<button data-paso="' + p.id + '"' +
        (p.listo ? "" : ' class="falta"') +
        ' aria-selected="' + (p.id === pasoActivo) + '">' + esc(p.nombre) +
        ins + "</button>";
    });
    $("pasos").innerHTML = html + "</div></div>";
  }
  pintaPasos();

  function vePaso(id) {
    pasoActivo = id;
    pintaPasos();
    recalcula();
  }

  $("pasos").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-paso]") : null;
    if (b) vePaso(b.getAttribute("data-paso"));
  });

  /* EL ARMAZON · lo monta el paso, no la costumbre. Un paso que no declara
     «vistas» no ensena la barra de vistas, y uno que no declara ningun lado
     no ensena el panel de la izquierda: se queda el ancho entero, que es lo
     que una pagina de avisos o un tablero necesitan. */
  function armaChrome() {
    var a = VISTAS.armazon(pasoActivo);
    $("vistas").hidden = !a.vistas;
    $("metricas").hidden = !a.vistas;
    var ver = a.lados.indexOf("ver") >= 0;
    var par = a.lados.indexOf("parametros") >= 0;
    $("lado-ver").hidden = !ver;
    $("lado-parametros").hidden = !par;
    $("izquierda").hidden = !a.lados.length;
    $("derecha").hidden = !a.vistas;
    $("obra").className = "obra" + (a.lados.length ? "" : " sin-izq") +
      (a.vistas ? "" : " sin-der");
    return a;
  }

  /* ---------- INICIO · el tablero -----------------------------------
     El primer paso puede estar lleno hoy porque no calcula nada nuevo:
     dice que hay en el libro y que falta. */
  function pintaInicio(fallo) {
    var f = VISTAS.inicio(m3, modelo);
    $("centro").innerHTML = '<div class="hoja"><h2>Galpón</h2>' +
      '<p class="lead">' + (m3
        ? "lo que hay en este libro, y en qué paso está"
        : "el galpón no se puede montar con los datos de ahora: " +
          esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.") + "</p>" +
      '<div class="rejilla">' + f.map(pintaFicha).join("") + "</div></div>";
  }

  /* ---------- COMPROBACION · lo que las guardas tienen que decir -----
     Las guardas de los modulos LANZAN cuando algo es imposible, y eso se
     ve enseguida. Lo que no se ve es lo que es legal pero cuesta: el alero
     a axial, los metros que no dilatan, las clases sin perfil. */
  function pintaComprobacion(fallo) {
    if (!m3) {
      /* si el galpon no se monta, ESO es lo primero que hay que comprobar */
      insignia = 1; pintaPasos();
      $("centro").innerHTML = '<div class="hoja"><h2>Comprobación</h2>' +
        '<p class="lead">hay 1 cosa que impide seguir</p>' +
        '<ol class="avisos"><li class="error"><span class="niv">error</span><b>' +
        esc(fallo ? fallo.titulo : "el galpón no se puede montar") + "</b>" +
        (fallo ? "<p>" + esc(fallo.mensaje) + "</p>" : "") +
        '<button class="ir" data-ir="geom">ir a Geometría</button></li></ol></div>';
      return;
    }
    var c = VISTAS.comprobacion(m3, modelo);
    insignia = c.insignia || null;
    pintaPasos();
    var cu = '<div class="cuenta">' +
      (c.cuenta.error ? '<span class="e">' + c.cuenta.error + " error(es)</span>" : "") +
      (c.cuenta.aviso ? '<span class="a">' + c.cuenta.aviso + " aviso(s)</span>"
        : '<span class="ok">ningún aviso</span>') +
      '<span>' + c.cuenta.nota + " nota(s)</span></div>";
    $("centro").innerHTML = '<div class="hoja"><h2>Comprobación</h2>' +
      '<p class="lead">' + esc(c.nota) + "</p>" + cu +
      '<ol class="avisos">' + c.lista.map(function (a) {
        return '<li class="' + a.nivel + '"><span class="niv">' + a.nivel +
          "</span><b>" + esc(a.que) + "</b>" +
          (a.fuente ? fuenteBtn(a.fuente) : "") +
          (a.porque ? "<p>" + esc(a.porque) + "</p>" : "") +
          (a.cuales && a.cuales.length
            ? '<div class="cuales">' + esc(a.cuales.join("  ·  ")) + "</div>" : "") +
          (a.paso ? '<button class="ir" data-ir="' + a.paso + '">ir a ' +
            esc(VISTAS.paso(a.paso).nombre) + "</button>" : "") +
          "</li>";
      }).join("") + "</ol></div>";
  }

  $("centro").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-ir]") : null;
    if (b) vePaso(b.getAttribute("data-ir"));
  });

  /* ---------- LO QUE TODAVIA NO TIENE PANTALLA ----------
     No se pone una maqueta. Un paso que parece hecho y esta vacio engana
     mas que uno que avisa, y lo que dice es util: QUE hara, QUE modulo lo
     hara y si el motor ya esta escrito. */
  function pintaTodavia(paso) {
    $("centro").innerHTML = '<div class="hoja"><h2>' + esc(paso.nombre) +
      "</h2><p class=\"lead\">" + esc(paso.grupo) + "</p>" +
      '<div class="todavia"><b>Todavía no hay pantalla para este paso.</b>' +
      "<br><br>Lo que enseñará: " + esc(paso.que || "—") +
      ".<br>La hará <code>" + esc(paso.hara || "—") + "</code>." +
      "<br>El motor: " + esc(paso.motor || "—") + ".<br><br>" +
      "No se pone una maqueta: una pestaña que parece hecha y está vacía " +
      "engaña más que una que avisa.</div></div>";
  }

  /* ---------- VER Y AISLAR · lo que estaba mal y por qué -------------
     Aquí había una paleta de dibujo copiada de Retícula, y era un error de
     método: en Retícula la planta es LIBRE —las columnas van donde van—,
     así que dibujar es imprescindible; en un galpón NO HAY NADA LIBRE,
     todo sale de los parámetros. Se copió la forma de la herramienta de al
     lado sin preguntar si el problema de debajo era el mismo.

     Lo que un modelo de 733 barras que no se dibuja necesita es poder
     MIRARSE: apagar las correas para ver el alma, aislar las diagonales,
     pinchar una barra y saber qué es. */
  var verEstado = { apagadas: {}, aislada: null };
  var barraSel = null;

  function pintaCapas(m3) {
    var c = VISTAS.capas(m3, verEstado);
    $("capas").innerHTML = c.filas.map(function (f) {
      return '<div class="capa' + (f.aislada ? " aislada" : "") +
        (f.visible ? "" : " apagada") + '" data-capa="' + esc(f.clase) + '">' +
        '<input type="checkbox" data-ver="' + esc(f.clase) + '"' +
        (f.visible ? " checked" : "") + (c.aislada ? " disabled" : "") + ">" +
        '<span class="nm" title="' + esc(f.clase) + " · " + esc(f.plano) + '">' +
        '<i style="border-top-color:' + (COLOR[f.clase] || "var(--tinta-2)") +
        '"></i> ' + esc(f.clase) + "</span>" +
        '<span class="n">' + f.barras + "</span>" +
        '<button class="ais" data-ais="' + esc(f.clase) + '">' +
        (f.aislada ? "todo" : "solo") + "</button></div>";
    }).join("");
    $("resumen").innerHTML = "<b>" + c.barrasVisibles + "</b> de " +
      c.barrasTotales + " barras<br>" + esc(c.nota);
  }

  /* ---------- el formulario, declarado en vistas.js ---------- */
  (function pintaFormulario() {
    $("f").innerHTML = VISTAS.grupos().map(function (g) {
      return "<fieldset><legend>" + esc(g.nombre) + "</legend>" +
        g.campos.map(campo).join("") + "</fieldset>";
    }).join("");
  })();

  function fuenteBtn(id) {
    return '<button class="fte" type="button" data-fte="' + id + '">fuente</button>';
  }
  function campo(c) {
    var et = esc(c.etiqueta) + (c.unidad ? " (" + esc(c.unidad) + ")" : "") +
      (c.fuente ? fuenteBtn(c.fuente) : "");
    var cid = "c_" + c.id;
    if (c.tipo === "si/no") {
      return '<div class="par ancho"><label class="marca-check">' +
        '<input type="checkbox" id="' + cid + '"' + (c.valor ? " checked" : "") +
        "><span>" + et + "</span></label></div>";
    }
    if (c.tipo === "opcion") {
      return '<div class="par ancho"><label for="' + cid + '">' + et +
        '</label><select id="' + cid + '">' + c.opciones.map(function (o) {
          return '<option value="' + o[0] + '"' +
            (o[0] === c.valor ? " selected" : "") + ">" + esc(o[1]) + "</option>";
        }).join("") + "</select></div>";
    }
    if (c.tipo === "lista") {
      return '<div class="par ancho"><label for="' + cid + '">' + et +
        '</label><input type="text" id="' + cid + '" value="' + esc(c.valor) +
        '" placeholder="' + esc(c.ayuda || "") + '"></div>';
    }
    var r = c.limiteDePantalla || [];
    return '<div class="par"><label for="' + cid + '">' + et +
      '</label><input type="number" id="' + cid + '" value="' + c.valor +
      '" step="' + c.paso + '"' +
      (r.length ? ' min="' + r[0] + '" max="' + r[1] + '"' : "") + "></div>";
  }

  function datos() {
    var d = {}, i, c, el;
    for (i = 0; i < VISTAS.ENTRADAS.length; i++) {
      c = VISTAS.ENTRADAS[i]; el = $("c_" + c.id);
      if (c.tipo === "si/no") d[c.id] = !!(el && el.checked);
      else if (c.tipo === "numero") d[c.id] = el ? +el.value : NaN;
      else d[c.id] = el ? el.value : "";
    }
    return d;
  }
  function paraElMotor(d) {
    var at = lista(d.at), af = lista(d.af);
    return { luz_m: d.luz, largo_m: d.largo, sepPorticos_m: d.sep,
      alturaColumna_m: d.hcol, ajustaSeparacion: d.ajusta,
      cuerdas: d.cuerdas, alma: d.alma,
      pendiente: d.pend / 100, pendienteInferior: d.pendi / 100,
      paneles: d.pan, peralteApoyo_m: d.h0,
      panosArriostradosTecho: at,
      panosArriostradosFachada: af.length ? af : at,
      columnasHastiales: lista(d.ch) };
  }

  /* ---------- vistas ---------- */
  var vistaActiva = "portico";
  (function pintaVistas() {
    $("vistas").innerHTML = VISTAS.PESTANAS.map(function (p) {
      return '<button data-v="' + p.id + '" aria-selected="' +
        (p.id === vistaActiva) + '">' + esc(p.nombre) + "</button>";
    }).join("");
  })();
  $("vistas").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-v]") : null;
    if (!b) return;
    vistaActiva = b.getAttribute("data-v");
    Array.prototype.forEach.call($("vistas").querySelectorAll("button[data-v]"),
      function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    recalcula();
  });

  /* ---------- el dibujo ---------- */
  var COLOR = { "columna":"var(--tinta)", "columna hastial":"var(--tinta-2)",
    "brida superior":"var(--tinta)", "brida inferior":"var(--tinta)",
    "diagonal":"var(--tinta-2)", "montante":"var(--tinta-2)",
    "correa":"var(--suave)", "viga de alero":"var(--suave)",
    "arriostre de techo":"var(--aviso)", "arriostre de fachada":"var(--aviso)" };
  var GRUESO = { "columna":2.2, "columna hastial":1.6, "brida superior":2,
    "brida inferior":2, "arriostre de techo":1.8, "arriostre de fachada":1.8 };
  var TINTA = { tinta:"var(--tinta)", "tinta-2":"var(--tinta-2)",
    suave:"var(--suave)", succion:"var(--aviso)", linea:"var(--linea)" };

  /* EL DIBUJO.  Las cotas, las etiquetas y los apoyos llegan de vistas.js
     en coordenadas del modelo y se transforman con el MISMO mapa que las
     barras: si el dibujo se mueve, las cifras se mueven con él. */
  var zoom = 1, ZMIN = 0.4, ZMAX = 6;
  var panX = 0, panY = 0;   /* encuadre, en unidades del lienzo */

  function dibuja(nudos, barras, px, py, orden, opacidad, anot) {
    var pos = {}, i;
    for (i = 0; i < nudos.length; i++) pos[nudos[i].id] = nudos[i];
    var xs = [], ys = [];
    for (i = 0; i < nudos.length; i++) { xs.push(px(nudos[i])); ys.push(py(nudos[i])); }
    if (!xs.length) return '<p class="nohay">nada que dibujar</p>';
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var w = Math.max(x1 - x0, 1e-6), h = Math.max(y1 - y0, 1e-6);

    /* margen generoso: las cotas viven fuera del dibujo y si no se les deja
       sitio salen cortadas, que es peor que no ponerlas */
    var W = 1000, mIzq = 86, mDer = 40, mAb = 74, mAr = 34;
    var k = (W - mIzq - mDer) / w;
    var H = h * k + mAb + mAr;
    if (H > 640) { k = (640 - mAb - mAr) / h; H = 640; }
    k = k * zoom;
    H = h * k + mAb + mAr;
    var X = function (x) { return mIzq + (x - x0) * k + panX; };
    var Y = function (y) { return H - mAb - (y - y0) * k + panY; };
    var XN = function (n) { return X(px(n)); };
    var YN = function (n) { return Y(py(n)); };

    var o = ['<svg viewBox="0 0 ' + Math.round(W * zoom) + " " + Math.round(H) +
      '" preserveAspectRatio="xMidYMid meet" role="img">'];
    var tocar = [];

    /* 1 · los ejes, detrás de todo */
    if (anot) {
      for (i = 0; i < anot.ejes.length; i++) {
        var e = anot.ejes[i];
        o.push('<line x1="' + X(e.x1).toFixed(1) + '" y1="' + Y(e.y1).toFixed(1) +
          '" x2="' + X(e.x2).toFixed(1) + '" y2="' + Y(e.y2).toFixed(1) +
          '" stroke="var(--linea)" stroke-width="0.8" stroke-dasharray="7 4 2 4"/>');
      }
    }

    /* 2 · las barras */
    var cola;
    if (orden && orden.length) {
      var porId = {};
      for (i = 0; i < barras.length; i++) porId[barras[i].id] = barras[i];
      cola = [];
      for (i = 0; i < orden.length; i++) if (porId[orden[i]]) cola.push(porId[orden[i]]);
    } else {
      cola = barras.slice().sort(function (a, b) {
        return (/arriostre/.test(a.clase) ? 1 : 0) - (/arriostre/.test(b.clase) ? 1 : 0);
      });
    }
    for (i = 0; i < cola.length; i++) {
      var b = cola[i], a = pos[b.i], c = pos[b.j];
      if (!a || !c) continue;
      var op = (opacidad && opacidad[b.id] !== undefined) ? opacidad[b.id] : 1;
      var sel = (b.clase === claseSel);
      var esta = (b.id === barraSel);
      o.push('<line x1="' + XN(a).toFixed(1) + '" y1="' + YN(a).toFixed(1) +
        '" x2="' + XN(c).toFixed(1) + '" y2="' + YN(c).toFixed(1) +
        '" stroke="' + (esta ? "var(--alerta)"
          : (sel ? "var(--acero)" : (COLOR[b.clase] || "var(--tinta-2)"))) +
        '" stroke-width="' + ((GRUESO[b.clase] || 1.1) * (esta ? 3 : (sel ? 2.2 : 1))) + '"' +
        (op < 1 ? ' stroke-opacity="' + op.toFixed(3) + '"' : "") +
        ' stroke-linecap="round"/>');
      /* una línea gorda y transparente encima, para poder pincharla: una
         barra de 1 px no se acierta con el ratón */
      tocar.push('<line class="toca" data-barra="' + esc(b.id) +
        '" x1="' + XN(a).toFixed(1) + '" y1="' + YN(a).toFixed(1) +
        '" x2="' + XN(c).toFixed(1) + '" y2="' + YN(c).toFixed(1) + '"/>');
    }

    if (!anot) return o.join("") + tocar.join("") + "</svg>";

    /* 3 · los apoyos, con su símbolo */
    for (i = 0; i < anot.apoyos.length; i++) {
      var ap = anot.apoyos[i], ax = X(ap.x), ay = Y(ap.y), t = 9;
      o.push('<path d="M' + ax.toFixed(1) + " " + ay.toFixed(1) +
        " L" + (ax - t).toFixed(1) + " " + (ay + t * 1.5).toFixed(1) +
        " L" + (ax + t).toFixed(1) + " " + (ay + t * 1.5).toFixed(1) +
        'Z" fill="none" stroke="var(--tinta)" stroke-width="1.4"/>');
      for (var q = -1; q <= 1; q++) {
        o.push('<line x1="' + (ax + q * 6 - 4).toFixed(1) + '" y1="' +
          (ay + t * 1.5 + 6).toFixed(1) + '" x2="' + (ax + q * 6 + 1).toFixed(1) +
          '" y2="' + (ay + t * 1.5).toFixed(1) +
          '" stroke="var(--tinta-2)" stroke-width="1"/>');
      }
      if (ap.tipo === "movil") {
        o.push('<line x1="' + (ax - t - 2).toFixed(1) + '" y1="' +
          (ay + t * 1.5 + 3).toFixed(1) + '" x2="' + (ax + t + 2).toFixed(1) +
          '" y2="' + (ay + t * 1.5 + 3).toFixed(1) +
          '" stroke="var(--tinta)" stroke-width="1.4"/>');
      }
    }

    /* 4 · las cotas */
    var SEP = 20;
    for (i = 0; i < anot.cotas.length; i++) {
      var ct = anot.cotas[i];
      var ax1 = X(ct.x1), ay1 = Y(ct.y1), ax2 = X(ct.x2), ay2 = Y(ct.y2);
      var d = SEP * ct.nivel, lx1, ly1, lx2, ly2, tx, ty, rot = "", anc = "middle";
      if (ct.lado === "abajo") {
        ly1 = ly2 = H - mAb + d; lx1 = ax1; lx2 = ax2;
        tx = (lx1 + lx2) / 2; ty = ly1 - 4;
      } else if (ct.lado === "izq") {
        lx1 = lx2 = mIzq - d; ly1 = ay1; ly2 = ay2;
        tx = lx1 - 5; ty = (ly1 + ly2) / 2;
        rot = ' transform="rotate(-90 ' + tx.toFixed(1) + " " + ty.toFixed(1) + ')"';
      } else {
        lx1 = lx2 = ax1 + d; ly1 = ay1; ly2 = ay2;
        tx = lx1 + 5; ty = (ly1 + ly2) / 2;
        rot = ' transform="rotate(-90 ' + tx.toFixed(1) + " " + ty.toFixed(1) + ')"';
      }
      /* líneas de referencia, de la pieza a la línea de cota */
      o.push('<line x1="' + ax1.toFixed(1) + '" y1="' + ay1.toFixed(1) + '" x2="' +
        lx1.toFixed(1) + '" y2="' + ly1.toFixed(1) +
        '" stroke="var(--linea)" stroke-width="0.6"/>');
      o.push('<line x1="' + ax2.toFixed(1) + '" y1="' + ay2.toFixed(1) + '" x2="' +
        lx2.toFixed(1) + '" y2="' + ly2.toFixed(1) +
        '" stroke="var(--linea)" stroke-width="0.6"/>');
      /* la línea de cota con sus marcas inclinadas, como en un plano */
      o.push('<line x1="' + lx1.toFixed(1) + '" y1="' + ly1.toFixed(1) + '" x2="' +
        lx2.toFixed(1) + '" y2="' + ly2.toFixed(1) +
        '" stroke="var(--tinta-2)" stroke-width="0.8"/>');
      [[lx1, ly1], [lx2, ly2]].forEach(function (q2) {
        o.push('<line x1="' + (q2[0] - 3).toFixed(1) + '" y1="' + (q2[1] + 3).toFixed(1) +
          '" x2="' + (q2[0] + 3).toFixed(1) + '" y2="' + (q2[1] - 3).toFixed(1) +
          '" stroke="var(--tinta-2)" stroke-width="1"/>');
      });
      o.push('<text class="cota" x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) +
        '" text-anchor="' + anc + '"' + rot + ">" + esc(ct.texto) + "</text>");
    }

    /* 5 · las etiquetas */
    for (i = 0; i < anot.etiquetas.length; i++) {
      var et = anot.etiquetas[i];
      var ex = X(et.x), ey = Y(et.yModelo !== undefined ? et.yModelo : et.y);
      if (et.forma === "circulo") {
        var cy = et.donde === "debajo" ? ey + 26 : ey - 26;
        o.push('<circle cx="' + ex.toFixed(1) + '" cy="' + cy.toFixed(1) +
          '" r="10" fill="var(--ficha)" stroke="var(--acero)" stroke-width="1.1"/>');
        o.push('<text class="ejeN" x="' + ex.toFixed(1) + '" y="' + (cy + 4).toFixed(1) +
          '" text-anchor="middle">' + esc(et.texto) + "</text>");
        o.push('<line x1="' + ex.toFixed(1) + '" y1="' + ey.toFixed(1) + '" x2="' +
          ex.toFixed(1) + '" y2="' + (cy + (et.donde === "debajo" ? -10 : 10)).toFixed(1) +
          '" stroke="var(--linea)" stroke-width="0.6"/>');
      } else if (et.forma === "marca") {
        o.push('<text class="marca" x="' + ex.toFixed(1) + '" y="' +
          (ey + (et.donde === "encima" ? -7 : 13)).toFixed(1) +
          '" text-anchor="middle">' + esc(et.texto) + "</text>");
      } else if (zoom >= 0.9) {
        o.push('<text class="etiq" x="' + ex.toFixed(1) + '" y="' +
          (ey + (et.donde === "encima" ? -7 : 13)).toFixed(1) +
          '" text-anchor="middle">' + esc(et.texto) + "</text>");
      }
    }
    return o.join("") + tocar.join("") + "</svg>";
  }

  /* ---------- panel derecho ---------- */
  var ETIQ = { norma:"", entrada:"dato", geometria:"geometría",
    conteo:"conteo", medido:"medido" };
  function pintaLinea(l) {
    var marca = l.origen === "norma" ? fuenteBtn(l.fuente)
      : '<span class="org">' + ETIQ[l.origen] + "</span>";
    return '<div class="ln"><span class="q">' + esc(l.q) + marca +
      '</span><span class="v' + (l.estado ? " " + l.estado : "") + '">' +
      esc(l.v) + "</span>" + (l.nota ? "<p>" + esc(l.nota) + "</p>" : "") + "</div>";
  }
  function pintaFicha(f) {
    return '<div class="tarj' + (f.estado === "bien" ? " bien" : "") + '"><h4>' +
      esc(f.titulo) + '</h4><p class="sub">' + esc(f.sub) + "</p>" +
      f.lineas.map(pintaLinea).join("") + "</div>";
  }

  /* ---------- LAS TABLAS · lo que faltaba para poder trabajar ----------
     Sin la de perfiles no se pueden asignar secciones, que es lo principal
     que hace esta herramienta: sin A ni I el analisis no corre. */
  var modelo = LIBRO.nuevo({});
  var claseSel = null;

  function tablaPerfiles(m3) {
    var t = VISTAS.tablaPerfiles(m3, modelo);
    var f = t.filas.map(function (r) {
      var v = r.perfil === null ? "" : r.perfil;
      var malo = v && !existePerfil(v);
      return '<tr' + (r.clase === claseSel ? ' class="sel"' : "") +
        ' data-clase="' + esc(r.clase) + '"><td>' + esc(r.clase) +
        '</td><td class="n">' + r.barras + '</td><td>' +
        '<input type="text" list="catalogo" data-perfil="' + esc(r.clase) +
        '" value="' + esc(v) + '" placeholder="— sin asignar —" class="' +
        (malo ? "malo" : (v ? "" : "vacio")) + '"></td></tr>';
    }).join("");
    return '<div class="tarj"><h4>Perfiles</h4><p class="sub">por clase de barra · ' +
      t.clases + " clases</p>" +
      '<table class="t"><thead><tr><th>Clase</th><th style="text-align:right">n</th>' +
      "<th>Perfil</th></tr></thead><tbody>" + f + "</tbody></table>" +
      '<p class="pie' + (t.sinPerfil ? " mal" : "") + '">' + esc(t.nota) + "</p></div>";
  }

  function tablaPanos(m3) {
    var t = VISTAS.tablaPanos(m3);
    var f = t.filas.map(function (r) {
      return "<tr><td>" + r.pano + '</td><td class="n">' + esc(r.entre) +
        '</td><td class="c"><input type="checkbox" data-at="' + r.pano + '"' +
        (r.techo ? " checked" : "") + '></td><td class="c">' +
        '<input type="checkbox" data-af="' + r.pano + '"' +
        (r.fachada ? " checked" : "") + "></td></tr>";
    }).join("");
    return '<div class="tarj"><h4>Paños</h4><p class="sub">' + t.panos +
      " paños · arriostre por plano</p>" +
      '<table class="t"><thead><tr><th>#</th><th style="text-align:right">entre</th>' +
      '<th class="c">techo</th><th class="c">fachada</th></tr></thead><tbody>' +
      f + "</tbody></table>" +
      '<p class="pie' + (t.filas.some(function (r) { return !r.alineado; }) ? " mal" : "") +
      '">' + esc(t.nota) + "</p></div>";
  }

  /* EL PANEL CONTEXTUAL · el equivalente del «CRUCE VACIO · Sin columna
     en B-2'» de Reticula. Pinchas una barra y sale lo que es. */
  function fichaSeleccion(m3) {
    if (!barraSel) {
      return '<div class="tarj"><h4>Nada seleccionado</h4>' +
        '<p class="sub">pincha una barra del dibujo</p>' +
        '<p class="pie">Con 733 barras, señalar una es la manera de hablar de ' +
        'ella: el panel dirá qué clase es, qué perfil lleva y cuánto mide.</p></div>';
    }
    var s = VISTAS.seleccion(m3, modelo, barraSel);
    if (!s) { barraSel = null; return fichaSeleccion(m3); }
    return '<div class="tarj" style="border-left-color:var(--alerta)"><h4>' +
      esc(s.id) + "</h4>" +
      '<p class="sub">' + esc(s.clase) + ' · <button class="fte" ' +
      'id="quita-sel" type="button">quitar</button></p>' +
      s.lineas.map(pintaLinea).join("") + "</div>";
  }

  var CATALOGO = null;
  function existePerfil(id) {
    if (!CATALOGO) {
      CATALOGO = {};
      PERFILES.activos().forEach(function (x) { CATALOGO[x.id] = true; });
    }
    return !!CATALOGO[id];
  }
  function pintaCatalogo() {
    if (document.getElementById("catalogo")) return;
    var a = PERFILES.activos(), por = {}, i;
    for (i = 0; i < a.length; i++) {
      (por[a[i].grupo] = por[a[i].grupo] || []).push(a[i].id);
    }
    var o = ['<datalist id="catalogo">'];
    Object.keys(por).sort().forEach(function (g) {
      por[g].forEach(function (id) {
        o.push('<option value="' + esc(id) + '">' + esc(g) + "</option>");
      });
    });
    var d = document.createElement("div");
    d.innerHTML = o.join("") + "</datalist>";
    document.body.appendChild(d);
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button.fte") : null;
    if (!b) return;
    var t = INVENTARIO.todo(b.getAttribute("data-fte"));
    $("fuente-id").textContent = t.id + "  ·  " + t.estado;
    $("fuente-t").textContent = t.magnitud;
    var f = [["Valor", t.valor + (t.unidad && t.unidad !== "—" ? " " + t.unidad : "")],
      ["Fuente", t.fuente], ["Sección", t.seccion]];
    if (t.nota) f.push(["Nota", t.nota]);
    $("fuente-dl").innerHTML = f.map(function (x) {
      return "<dt>" + x[0] + "</dt><dd>" + esc(x[1]) + "</dd>";
    }).join("");
    $("fuente").hidden = false;
  });
  $("cerrar-fuente").onclick = function () { $("fuente").hidden = true; };

  /* ---------- EL RECALCULO, EN DOS ----------
     Cambiar un parametro obliga a rehacer el modelo; mover la camara, no.
     Separarlo no es optimizar -monta() tarda 3,6 ms- sino no mentir: la
     camara NO puede cambiar un numero del calculo, y la unica manera de
     garantizarlo es que no lo vuelva a hacer. Es la misma separacion que
     ya existe en los datos, datosModelo contra datosVista, llevada al
     repintado. */
  var m3 = null;
  function repinta() { recalcula(true); }
  function recalcula(soloVista) {
    var paso = VISTAS.paso(pasoActivo);
    armaChrome();

    var d = datos();
    if (soloVista && m3) { pintaLienzo(d); return; }
    var fallo = montaGalpon(d);
    /* la insignia de Comprobacion, como en Reticula: el numero de avisos en
       la propia pestana, desde el paso que sea, para no tener que entrar a
       mirar si hay */
    var ins = m3 ? (VISTAS.comprobacion(m3, modelo).insignia || null) : 1;
    if (ins !== insignia) { insignia = ins; pintaPasos(); }
    if (!paso.listo) { pintaTodavia(paso); return; }
    /* EL GALPON SE MONTA EN CUALQUIER PASO. Antes solo se montaba al pasar
       por Geometria, y abrir en Inicio o en Comprobacion decia «no hay
       geometria montada» con los parametros puestos. Los campos siguen en
       la pagina aunque esten ocultos, asi que se pueden leer siempre. */
    if (pasoActivo === "inicio") { pintaInicio(fallo); return; }
    if (pasoActivo === "comprob") { pintaComprobacion(fallo); return; }

    if (fallo) {
      $("metricas").innerHTML = "";
      $("centro").innerHTML = '<div class="guarda"><b>' + esc(fallo.titulo) +
        "</b><pre>" + esc(fallo.mensaje) + "\n\n" + esc(fallo.porQue) + "</pre></div>";
      $("derecha").innerHTML = '<p class="nohay">' + esc(fallo.porQue) + "</p>";
      return;
    }

    pintaMetricas(d);
    pintaLienzo(d);
  }

  /* Monta el galpon con lo que digan los campos. Devuelve el fallo, o
     null si se pudo; deja m3 en null si no se pudo, para que ningun paso
     ensene un galpon viejo como si fuera el de ahora. */
  function montaGalpon(d) {
    var v = VISTAS.valida(d);
    var fallo = null;
    if (!v.ok) {
      fallo = { titulo: "Hay campos que no se pueden leer",
        mensaje: v.malos.map(function (x) {
          return "  - " + x.etiqueta + ": " + x.que +
            (x.limiteDePantalla ? "\n      (tope de pantalla, no criterio de diseño)" : "");
        }).join("\n"),
        porQue: "Esto solo comprueba la FORMA. Las reglas de diseño las comprueba " +
          "el motor, y no se copian aquí." };
    } else {
      try { m3 = MONTAJE.monta(paraElMotor(VISTAS.datosModelo(d))); }
      catch (e) { m3 = null; fallo = VISTAS.problema(e); fallo.porQue = fallo.porQueNoSeDibuja; }
    }
    if (fallo) m3 = null;
    return fallo;
  }

  function pintaLienzo(d) {
    var vista = VISTAS.datosVista(d);
    var dj = VISTAS.dibujo(vistaActiva, m3, vista);
    var anot = VISTAS.anotaciones(vistaActiva, m3, vista);
    pintaCapas(m3);
    dj.barras = VISTAS.filtra(dj.barras, verEstado);
    var es3d = vistaActiva === "tresd";
    $("centro").innerHTML = '<div class="marco' + (es3d ? " orbitable" : "") + '">' +
      '<div class="zoom"><button data-z="-">−</button>' +
      '<button data-z="0">▣</button><button data-z="+">+</button></div>' +
      (es3d ? cubo(d) : "") +
      dibuja(dj.nudos, dj.barras,
        function (n) { return n[dj.ejeX]; },
        function (n) { return n[dj.ejeY]; }, dj.orden, dj.opacidad, anot) +
      '<div class="escala">zoom ×' + n2(zoom, 2) + "  ·  " +
      anot.cotas.length + " cotas</div>" +
      (es3d ? '<div class="pista">arrastra para girar · rueda para acercar</div>' : "") +
      '<div class="leyenda">' + dj.leyenda.map(function (x) {
        return '<span><i style="border-top-color:' + (TINTA[x[1]] || x[1]) + '"></i>' +
          esc(x[0]) + "</span>";
      }).join("") + "</div></div>";
    $("derecha").innerHTML = fichaSeleccion(m3) + tablaPerfiles(m3) +
      tablaPanos(m3) +
      VISTAS.fichas(vistaActiva, m3, vista).map(pintaFicha).join("");
    pintaCatalogo();
  }

  /* EL CUBO DE VISTAS · cuatro de un clic, y las cuatro se pueden medir.
     Y el aviso de si lo que se está mirando es medible o no, que es lo
     único que una vista «solo ver» tiene obligación de declarar. */
  function cubo(d) {
    var act = null;
    for (var k in VISTA3D.PRESETS) {
      var pr = VISTA3D.PRESETS[k];
      if (pr.tipo === d.proy && Math.abs(pr.azimut - d.azim) < 0.6 &&
          Math.abs(pr.elevacion - d.elev3d) < 0.6) { act = k; }
    }
    var b = Object.keys(VISTA3D.PRESETS).map(function (k) {
      return '<button data-vista="' + k + '" aria-pressed="' + (k === act) + '">' +
        esc(VISTA3D.PRESETS[k].nombre) + "</button>";
    }).join("");
    var medible = d.proy !== "perspectiva";
    return '<div class="cubo">' + b + "</div>" +
      '<div class="medible ' + (medible ? "si" : "no") + '"' +
      (medible ? "" : ' id="a-iso" title="volver a isométrica"') + ">" +
      (medible ? "se puede medir" : "NO se puede medir · volver a Iso") + "</div>";
  }

  function pintaMetricas(d) {
    var met = MONTAJE.metrado(m3);
    var c = [
      ["Luz", n2(m3.luz_m) + " m"],
      ["Largo", n2(m3.ejes.largo_m) + " m"],
      ["Pórticos", m3.ejes.porticos + " @ " + n2(m3.ejes.sepPorticos_m)],
      ["Acero", n2(met.total_m, 0) + " m"],
      ["Barras", String(m3.conteo.barras)]
    ];
    $("metricas").innerHTML = c.map(function (x) {
      return '<div><span class="k">' + x[0] + '</span><span class="n">' +
        esc(x[1]) + "</span></div>";
    }).join("") +
      '<div class="pasada"><span class="k">Pasada</span><span class="n">1 de 1</span></div>' +
      '<div><span class="k">Combinación</span><select id="comb" disabled>' +
      '<option>0,9D − 1,3W · levantamiento</option></select></div>';
  }

  $("f").addEventListener("input", recalcula);
  $("f").addEventListener("change", recalcula);

  /* zoom y selección */
  $("centro").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-z]") : null;
    if (b) {
      var z = b.getAttribute("data-z");
      if (z === "+") zoom = Math.min(ZMAX, zoom * 1.35);
      else if (z === "-") zoom = Math.max(ZMIN, zoom / 1.35);
      else zoom = 1;
      recalcula();
      return;
    }
    /* el cubo de vistas */
    var cv = ev.target.closest ? ev.target.closest("button[data-vista]") : null;
    if (cv) {
      var pr = VISTA3D.PRESETS[cv.getAttribute("data-vista")];
      $("c_proy").value = pr.tipo;
      $("c_azim").value = Math.round(pr.azimut * 10) / 10;
      $("c_elev3d").value = Math.round(pr.elevacion * 10) / 10;
      panX = panY = 0;
      recalcula();
      return;
    }
    if (ev.target && ev.target.id === "a-iso") {
      var iso = VISTA3D.PRESETS.iso;
      $("c_proy").value = iso.tipo;
      $("c_azim").value = Math.round(iso.azimut * 10) / 10;
      $("c_elev3d").value = Math.round(iso.elevacion * 10) / 10;
      recalcula();
      return;
    }
    /* SELECCIONAR, pero solo si fue un clic y no el final de un arrastre */
    if (arrastre && arrastre.movido) return;
    var l = ev.target.closest ? ev.target.closest("line[data-barra]") : null;
    if (l) {
      var id = l.getAttribute("data-barra");
      barraSel = (barraSel === id) ? null : id;
      recalcula();
    }
  });

  /* ---------- TODO CON EL RATON, SIN TECLAS ----------

       izquierdo arrastrando   girar   (en las vistas planas, encuadrar)
       derecho   arrastrando   encuadrar
       central   arrastrando   encuadrar tambien, para la memoria de Revit
       rueda                   acercar
       izquierdo SIN mover     seleccionar la barra

     EL UMBRAL ES LO QUE HACE QUE CONVIVAN clic y arrastre: por debajo de
     4 px es un clic, por encima es un arrastre. Nadie lo nota, y es lo que
     evita tener que pulsar una tecla para girar.

     EL BOTON CENTRAL VA DE PROPINA. Dentro de un dialogo de Excel es
     traicionero -WebView2 puede quedarse con el autoscroll, y en un
     portatil sin raton no existe- asi que el derecho hace lo mismo. Si el
     central pasa, se tiene; si no, no se pierde nada.

     Y LO QUE DE VERDAD FALLABA: girar escribia el azimut y la camara lo
     TIRABA, porque la proyeccion era «isometrica» y la isometrica tiene
     los angulos clavados -45 y atan(1/raiz2)- que es lo que la hace
     medible. vista3d.js ya sabia la regla y gira() la aplica: al girar
     deja de ser isometrica. La plantilla no la usaba. */
  var UMBRAL = 4;
  var arrastre = null;

  function esPlana() { return vistaActiva !== "tresd"; }

  $("centro").addEventListener("contextmenu", function (ev) {
    /* el derecho encuadra, asi que su menu estorba */
    if (ev.target.closest && ev.target.closest(".marco")) ev.preventDefault();
  });

  $("centro").addEventListener("mousedown", function (ev) {
    if (ev.target.closest && ev.target.closest("button")) return;
    if (!(ev.target.closest && ev.target.closest(".marco"))) return;
    arrastre = {
      x: ev.clientX, y: ev.clientY, boton: ev.button, movido: false,
      az: +$("c_azim").value, el: +$("c_elev3d").value,
      px: panX, py: panY
    };
    ev.preventDefault();
  });

  document.addEventListener("mousemove", function (ev) {
    if (!arrastre) return;
    var dx = ev.clientX - arrastre.x, dy = ev.clientY - arrastre.y;
    if (!arrastre.movido && Math.abs(dx) + Math.abs(dy) < UMBRAL) return;
    arrastre.movido = true;

    /* derecho o central: encuadrar. Izquierdo: girar en la 3D, encuadrar
       en las planas, que no tienen nada que girar. */
    var encuadra = (arrastre.boton !== 0) || esPlana();
    if (encuadra) {
      panX = arrastre.px + dx;
      panY = arrastre.py + dy;
      repinta();
      return;
    }
    /* AL GIRAR DEJA DE SER ISOMETRICA, y hay que decirselo a la camara o
       se queda con sus angulos clavados y no pasa nada */
    if ($("c_proy").value === "isometrica") $("c_proy").value = "ortografica";
    $("c_azim").value = Math.round(arrastre.az - dx * 0.4);
    $("c_elev3d").value = Math.max(-89, Math.min(89,
      Math.round(arrastre.el + dy * 0.4)));
    repinta();
  });

  document.addEventListener("mouseup", function () {
    if (arrastre) arrastre.fin = true;
    setTimeout(function () { arrastre = null; }, 0);
  });

  /* la rueda acerca, en cualquier vista */
  $("centro").addEventListener("wheel", function (ev) {
    if (!(ev.target.closest && ev.target.closest(".marco"))) return;
    ev.preventDefault();
    zoom = ev.deltaY < 0 ? Math.min(ZMAX, zoom * 1.12) : Math.max(ZMIN, zoom / 1.12);
    repinta();
  }, { passive: false });

  /* ---------- VER Y AISLAR ---------- */
  $("capas").addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("button[data-ais]") : null;
    if (!a) return;
    var c = a.getAttribute("data-ais");
    verEstado.aislada = (verEstado.aislada === c) ? null : c;
    recalcula();
  });
  $("capas").addEventListener("change", function (ev) {
    var v = ev.target.getAttribute && ev.target.getAttribute("data-ver");
    if (v === null || v === undefined) return;
    if (ev.target.checked) delete verEstado.apagadas[v];
    else verEstado.apagadas[v] = true;
    recalcula();
  });

  /* LAS TABLAS EDITAN · asignar perfil y arriostrar paños */
  $("derecha").addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute("data-perfil")) {
      var clase = t.getAttribute("data-perfil"), v = t.value.trim();
      if (v === "") {
        delete modelo.secciones.porClase[clase];
      } else if (!existePerfil(v)) {
        t.className = "malo";
        return;   /* no se guarda un perfil que no está en el catálogo */
      } else {
        modelo = LIBRO.asignaPerfil(modelo, { clase: clase }, v).modelo;
      }
      recalcula();
      return;
    }
    var at = t.getAttribute && t.getAttribute("data-at");
    var af = t.getAttribute && t.getAttribute("data-af");
    if (at !== null && at !== undefined) { marca("c_at", +at, t.checked); return; }
    if (af !== null && af !== undefined) { marca("c_af", +af, t.checked); return; }
  });

  /* la casilla de la tabla y el campo de texto son la MISMA cosa: se
     escribe en el campo para que no haya dos verdades */
  function marca(campo, pano, on) {
    var el = $(campo);
    if (!el) return;
    var v = lista(el.value);
    var i = v.indexOf(pano);
    if (on && i < 0) v.push(pano);
    if (!on && i >= 0) v.splice(i, 1);
    v.sort(function (a, b) { return a - b; });
    el.value = v.join(", ");
    recalcula();
  }

  /* quitar la selección */
  $("derecha").addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "quita-sel") { barraSel = null; recalcula(); }
  });

  /* pinchar una fila de perfiles resalta esa clase en el dibujo */
  $("derecha").addEventListener("click", function (ev) {
    var tr = ev.target.closest ? ev.target.closest("tr[data-clase]") : null;
    if (!tr) return;
    var c = tr.getAttribute("data-clase");
    claseSel = (claseSel === c) ? null : c;
    recalcula();
  });

  recalcula();

  /* ---------- EL CANAL CON EL PANEL ---------- */
  var cesta = {};
  function manda(obj) {
    if (typeof Office !== "undefined" && Office.context && Office.context.ui &&
        Office.context.ui.messageParent) {
      Office.context.ui.messageParent(JSON.stringify(obj));
    }
  }
  function modeloActual() {
    var d = datos();
    var m = LIBRO.nuevo(Object.assign({ nombre: "galpón" },
      paraElMotor(VISTAS.datosModelo(d))));
    m.vista = VISTAS.datosVista(d);
    m.secciones = modelo.secciones;   /* los perfiles asignados viajan */
    m.ediciones = modelo.ediciones;
    return m;
  }
  $("b-guardar").onclick = function () {
    try {
      LIBRO.troceaMensaje("mod", LIBRO.serializa(modeloActual()))
        .forEach(function (t, i, a) {
          if (i === a.length - 1) t.cerrar = true;
          manda(t);
        });
    } catch (e) { alert(e.message); }
  };
  $("b-descartar").onclick = function () { manda({ a: "cerrar" }); };

  if (typeof Office !== "undefined" && Office.onReady) {
    Office.onReady(function () {
      manda({ a: "pide" });
      if (Office.context.ui.addHandlerAsync) {
        Office.context.ui.addHandlerAsync(
          Office.EventType.DialogParentMessageReceived, function (arg) {
            var msg;
            try { msg = JSON.parse(arg.message); } catch (e) { return; }
            if (msg.a !== "mod" || msg.n === 0) return;
            var texto = LIBRO.juntaMensaje(cesta, msg);
            if (texto === null) return;
            try { aplicaModelo(LIBRO.deserializa(texto).modelo); } catch (e) {}
          });
      }
    });
  }

  function aplicaModelo(m) {
    var p = m.parametros || {}, k;
    var mapa = { luz: "luz_m", largo: "largo_m", sep: "sepPorticos_m",
      hcol: "alturaColumna_m", pan: "paneles", h0: "peralteApoyo_m" };
    for (k in mapa) if (p[mapa[k]] !== undefined && $("c_" + k)) {
      $("c_" + k).value = p[mapa[k]];
    }
    if (p.pendiente !== undefined && $("c_pend")) $("c_pend").value = p.pendiente * 100;
    if (p.cuerdas && $("c_cuerdas")) $("c_cuerdas").value = p.cuerdas;
    if (p.alma && $("c_alma")) $("c_alma").value = p.alma;
    if (p.panosArriostradosTecho && $("c_at")) {
      $("c_at").value = p.panosArriostradosTecho.join(", ");
    }
    if (p.panosArriostradosFachada && $("c_af")) {
      $("c_af").value = p.panosArriostradosFachada.join(", ");
    }
    if (m.secciones) modelo.secciones = m.secciones;
    if (m.ediciones) modelo.ediciones = m.ediciones;
    recalcula();
  }
})();
</script>
