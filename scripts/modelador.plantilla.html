<title>Galpón · modelador</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root {
  --tinta:#1b2430; --tinta-2:#4a5568; --papel:#f2f1ec; --papel-2:#e6e4dc;
  --ficha:#fbfaf7; --linea:#cdcabd; --acero:#2f6f8f;
  --ok:#1d6a4f; --aviso:#b4531a; --alerta:#8c2f39; --suave:#6b6f76;
  --disp:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --cuerpo:"IBM Plex Sans",system-ui,sans-serif;
  --cifra:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --tinta:#e8e6df; --tinta-2:#b3b8c0; --papel:#14181d; --papel-2:#1c2128;
  --ficha:#1a1f26; --linea:#343b45; --acero:#79b8d4;
  --ok:#57c79a; --aviso:#f0a35e; --alerta:#e58592; --suave:#8b929c;
  color-scheme: dark; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--papel); color:var(--tinta); font-family:var(--cuerpo);
  font-size:13.5px; line-height:1.4; margin:0; display:flex; flex-direction:column; }

/* ---- cabecera ---- */
header { border-bottom:2px solid var(--tinta); padding:10px 16px 8px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
header h1 { font-family:var(--disp); font-weight:600; font-size:24px; margin:0;
  letter-spacing:-0.01em; }
.chip { font-family:var(--cifra); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; border:1px solid var(--linea); border-radius:2px;
  padding:2px 6px; color:var(--tinta-2); background:var(--ficha); }
.chip.a { border-color:var(--acero); color:var(--acero); }
header .lema { color:var(--tinta-2); font-size:12.5px; flex:1; min-width:160px; }
header .der { display:flex; gap:7px; align-items:center; }
button.h { font-family:var(--cuerpo); font-size:12.5px; padding:6px 12px;
  border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  color:var(--tinta); cursor:pointer; }
button.h.pri { background:var(--acero); border-color:var(--acero); color:#fff;
  font-weight:600; }
button.h:hover { border-color:var(--acero); }

/* OCULTO ES OCULTO. Una regla de autor con display:flex le gana al
   [hidden] del navegador, y la barra de vistas se seguia viendo en Cargas
   con el atributo puesto. Esta regla va primero y con !important a
   proposito: es la unica manera de que hidden signifique lo que dice. */
[hidden] { display:none !important; }

/* ---- barra de pasos ---- */
nav.pasos { border-bottom:1px solid var(--linea); padding:7px 16px 0;
  display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; }
.grupo { display:flex; flex-direction:column; gap:3px; }
.grupo > span { font-family:var(--cifra); font-size:8.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--suave); }
.grupo > div { display:flex; }
nav.pasos button { font-family:var(--disp); font-size:12.5px; font-weight:600;
  letter-spacing:.02em; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--suave); padding:5px 10px 7px; cursor:pointer; white-space:nowrap; }
nav.pasos button[aria-selected="true"] { color:var(--acero); border-bottom-color:var(--acero); }
nav.pasos button .ins { font-family:var(--cifra); font-size:9px; background:var(--aviso);
  color:#fff; border-radius:8px; padding:0 5px; margin-left:5px; vertical-align:1px; }
nav.pasos button.falta { color:var(--linea); }

/* ---- vistas + métricas ---- */
nav.vistas { border-bottom:1px solid var(--linea); padding:0 16px; display:flex;
  gap:0; align-items:center; }
nav.vistas button { font-family:var(--disp); font-size:12.5px; font-weight:600;
  background:none; border:0; border-bottom:2px solid transparent; color:var(--suave);
  padding:7px 12px; cursor:pointer; }
nav.vistas button[aria-selected="true"] { color:var(--tinta); border-bottom-color:var(--tinta); }

.metricas { display:flex; gap:0; flex-wrap:wrap; border-bottom:1px solid var(--linea);
  background:var(--ficha); }
.metricas > div { padding:6px 14px; border-right:1px solid var(--papel-2);
  display:flex; gap:7px; align-items:baseline; }
.metricas .k { font-family:var(--cifra); font-size:9px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--suave); }
.metricas .n { font-family:var(--cifra); font-size:13px; font-weight:500;
  font-variant-numeric:tabular-nums; }
.metricas select { font-family:var(--cifra); font-size:12px; border:1px solid var(--linea);
  border-radius:2px; background:var(--papel); color:var(--tinta); padding:1px 4px; }
.metricas .pasada .n { color:var(--acero); }

/* ---- la reja de trabajo ---- */
.obra { flex:1; display:grid; grid-template-columns:210px minmax(0,1fr) 300px;
  min-height:0; }
/* LA REJA LA ELIGE EL PASO. Con tres columnas fijas, ocultar los lados
   dejaba el centro en la primera -la de 210 px- y todo salia apretado a la
   izquierda con la pantalla vacia al lado. Sin lado, sin su columna. */
.obra.sin-izq { grid-template-columns:minmax(0,1fr) 300px; }
.obra.sin-der { grid-template-columns:210px minmax(0,1fr); }
.obra.sin-izq.sin-der { grid-template-columns:minmax(0,1fr); }
@media (max-width:1100px) { .obra { grid-template-columns:180px minmax(0,1fr); }
  .obra > aside.der { display:none; }
  .obra.sin-izq { grid-template-columns:minmax(0,1fr); } }
/* LA FRANJA DE DATOS. Los formularios de Datos, Cargas, Análisis, Diseño,
   Conexiones y Cimentación iban en la columna de 210 px de la izquierda,
   apretados y con scroll largo, y el usuario lo dijo: «no me gusta que todo
   esté en un extremo». Van arriba del centro, a lo ancho, con los grupos en
   columnas; los resultados, debajo. Se pliega. Geometría sigue con su
   columna: allí las capas acompañan al dibujo. */
.obra.banda { grid-template-columns:minmax(0,1fr) 300px; grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"izq der" "centro der"; }
.obra.banda.sin-der { grid-template-columns:minmax(0,1fr); grid-template-areas:"izq" "centro"; }
.obra.banda > aside.izq { grid-area:izq; border-right:none; border-bottom:1px solid var(--linea);
  max-height:46vh; padding:8px 18px 10px; }
.obra.banda > main { grid-area:centro; }
.obra.banda > aside.der { grid-area:der; }
.obra.banda > aside.izq form { display:grid; gap:4px 14px; align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.obra.banda > aside.izq h3.sec { display:none; }
/* DATOS, como en Retícula: pestañas, y en cada tarjeta el dato con lo que sale de él */
.obra.banda #lado-datos .subd:not([hidden]) { display:grid; gap:4px 14px; align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); }
.obra.banda #lado-datos form { display:contents; }
.obra.banda.en-datos > aside.izq { max-height:74vh; }
nav.subdatos { display:flex; gap:2px; border-bottom:1px solid var(--linea); margin:0 0 10px; }
nav.subdatos button { font-family:var(--disp); font-size:12px; font-weight:600; background:none; border:none;
  border-bottom:2px solid transparent; color:var(--suave); padding:5px 12px; cursor:pointer; }
nav.subdatos button[aria-pressed="true"] { color:var(--acero); border-bottom-color:var(--acero); }
.par.fijo { display:grid; grid-template-columns:1fr auto; gap:0 8px; align-items:baseline;
  border-top:1px dashed var(--papel-2); padding-top:3px; }
.par.fijo .et { font-size:11.5px; color:var(--tinta-2); }
.par.fijo b { font-family:var(--cifra); font-size:12.5px; color:var(--acero); text-align:right; }
.par.fijo small { grid-column:1 / -1; font-size:10px; color:var(--suave); text-align:right; }
.obra.banda.plegada > aside.izq { max-height:none; overflow:hidden; }
.obra.banda.plegada > aside.izq > div:not(.banda-cab) { display:none; }
.banda-cab { display:none; }
.obra.banda .banda-cab { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.banda-cab b { font-family:var(--cifra); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--suave); font-weight:500; }
.banda-cab button { font-family:var(--cifra); font-size:10px; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--acero); padding:1px 7px; cursor:pointer; }
@media (max-width:1100px) { .obra.banda { grid-template-columns:minmax(0,1fr); grid-template-areas:"izq" "centro"; } }
.obra > * { overflow:auto; min-width:0; }
table.perf td.pp { padding:5px 0 6px; }
table.perf .pc { font-size:12px; display:flex; justify-content:space-between; align-items:baseline; }
table.perf .pc .n { font-family:var(--cifra); font-size:9.5px; color:var(--suave); }
table.perf td.pp select { display:block; width:100%; margin:2px 0; font-family:var(--cifra); font-size:11px;
  padding:2px 3px; border:1px solid var(--linea); border-radius:2px; background:var(--papel); color:var(--tinta); }
table.perf td.pp select.vacio { color:var(--suave); border-style:dashed; }
table.perf td.pp span.malo { font-size:10px; color:var(--alerta); }
aside.izq { border-right:1px solid var(--linea); padding:10px 11px 24px; }
aside.der { border-left:1px solid var(--linea); padding:10px 12px 24px;
  background:var(--ficha); }
main.lienzo { padding:10px 12px; display:flex; flex-direction:column; }

h3.sec { font-family:var(--cifra); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--suave); margin:0 0 7px; font-weight:500; }
h3.sec + h3.sec { margin-top:16px; }

/* capas · ver y aislar */
.capas { margin-bottom:6px; }
.capa { display:grid; grid-template-columns:16px 1fr auto auto; gap:6px;
  align-items:center; padding:3px 4px; border-radius:2px; font-size:12px; }
.capa:hover { background:var(--papel-2); }
.capa.aislada { background:var(--papel-2); outline:1px solid var(--acero); }
.capa.apagada { opacity:.45; }
.capa i { width:12px; height:0; border-top-width:3px; border-top-style:solid; }
.capa .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.capa .n { font-family:var(--cifra); font-size:10.5px; color:var(--suave);
  font-variant-numeric:tabular-nums; }
.capa button.ais { font-family:var(--cifra); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--suave); padding:0 4px; cursor:pointer; }
.capa button.ais:hover, .capa.aislada button.ais { color:var(--acero);
  border-color:var(--acero); }
.capa input { margin:0; }
.resumen { font-family:var(--cifra); font-size:10px; color:var(--suave);
  border-top:1px solid var(--papel-2); padding-top:5px; margin-bottom:14px; }
.resumen b { color:var(--acero); }

/* parámetros */
fieldset { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  margin:0 0 9px; padding:8px 9px 9px; }
legend { font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--acero); padding:0 4px; }
.par { display:grid; grid-template-columns:1fr 70px; gap:4px 6px; align-items:center;
  margin-bottom:5px; }
.par.ancho { grid-template-columns:1fr; }
.par.ancho input[type="text"] + select { margin-top:3px; }
.par label { font-size:11.5px; color:var(--tinta-2); }
.par input, .par select { font-family:var(--cifra); font-size:11.5px; width:100%;
  padding:2px 4px; border:1px solid var(--linea); border-radius:2px;
  background:var(--papel); color:var(--tinta); }
.marca-check { display:flex; gap:6px; align-items:center; }
.marca-check input { width:auto; }

/* lienzo */
.marco { border:1px solid var(--linea); border-radius:3px; background:var(--ficha);
  padding:8px; flex:1; display:flex; flex-direction:column; min-height:260px;
  position:relative; }
.zoom { position:absolute; top:10px; right:12px; display:flex; gap:2px; z-index:2; }
.cubo { position:absolute; top:10px; left:12px; display:flex; gap:2px; z-index:2; }
.cubo button { font-family:var(--disp); font-size:11px; font-weight:600; padding:3px 9px;
  border:1px solid var(--linea); background:var(--papel); color:var(--tinta-2);
  cursor:pointer; border-radius:2px; }
.cubo button[aria-pressed="true"] { background:var(--acero); border-color:var(--acero);
  color:#fff; }
.cubo button:hover { border-color:var(--acero); }
.medible { position:absolute; top:40px; left:12px; z-index:2; font-family:var(--cifra);
  font-size:10px; padding:2px 7px; border-radius:2px; }
.medible.si { color:var(--ok); border:1px solid var(--ok); background:var(--papel); }
.medible.no { color:var(--alerta); border:1px solid var(--alerta); background:var(--papel);
  cursor:pointer; }
.zoom button { font-family:var(--cifra); font-size:13px; width:26px; height:24px;
  border:1px solid var(--linea); background:var(--papel); color:var(--tinta);
  cursor:pointer; border-radius:2px; line-height:1; }
.zoom button:hover { border-color:var(--acero); color:var(--acero); }
.escala { position:absolute; bottom:12px; left:14px; font-family:var(--cifra);
  font-size:10px; color:var(--suave); }
text.cota { font-family:var(--cifra); font-size:11px; fill:var(--tinta-2); }
text.etiq { font-family:var(--cifra); font-size:10px; fill:var(--suave); }
text.ejeN { font-family:var(--cifra); font-size:11px; fill:var(--acero);
  font-weight:600; }
text.marca { font-family:var(--cifra); font-size:10px; fill:var(--aviso);
  letter-spacing:.06em; }
line.toca { stroke:transparent; stroke-width:9; cursor:pointer; }
.marco.orbitable svg { cursor:grab; }
.marco.orbitando svg, .marco.encuadrando svg { cursor:grabbing; }
.pista { position:absolute; bottom:12px; right:14px; font-family:var(--cifra);
  font-size:10px; color:var(--suave); }
.marco svg { display:block; width:100%; height:auto; }
/* la 3D con el acero de verdad · fila V.solidos */
.gl-host { position:relative; width:100%; height:64vh; min-height:360px; cursor:grab; }
.gl-host canvas { display:block; width:100%; height:100%; }
.marco.orbitando .gl-host { cursor:grabbing; }
.modo3d { position:absolute; top:40px; left:130px; display:flex; gap:2px; z-index:2; }
.modo3d button { font-family:var(--cifra); font-size:10px; padding:2px 8px; border:1px solid var(--linea);
  background:var(--papel); color:var(--tinta-2); cursor:pointer; border-radius:2px; }
.modo3d button[aria-pressed="true"] { background:var(--acero); border-color:var(--acero); color:#fff; }
.sin-gl { padding:30px; color:var(--alerta); font-size:12px; }
/* en la 3D la escala sube, para no pisar la leyenda */
.marco.orbitable .escala { bottom:auto; top:40px; left:auto; right:14px; }
.leyenda { display:flex; flex-wrap:wrap; gap:11px; margin-top:7px; font-size:10.5px;
  color:var(--suave); font-family:var(--cifra); }
.leyenda i { display:inline-block; width:15px; border-top-width:2px;
  border-top-style:solid; vertical-align:middle; margin-right:4px; }

/* tablas del panel derecho */
table.t { width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:4px; }
table.t th { font-family:var(--cifra); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--suave); font-weight:500; text-align:left;
  padding:3px 4px; border-bottom:1px solid var(--linea); }
table.t td { padding:2px 4px; border-bottom:1px solid var(--papel-2);
  vertical-align:middle; }
table.t td.n { font-family:var(--cifra); text-align:right;
  font-variant-numeric:tabular-nums; color:var(--suave); }
table.t td.c { text-align:center; }
table.t input[type=text] { width:100%; font-family:var(--cifra); font-size:11px;
  padding:1px 3px; border:1px solid var(--linea); border-radius:2px;
  background:var(--papel); color:var(--tinta); }
table.t input.malo { border-color:var(--alerta); color:var(--alerta); }
table.t input.vacio { border-style:dashed; }
table.t tr.sel td { background:var(--papel-2); }
.pie { font-size:10.5px; color:var(--suave); margin:2px 0 12px; }
.pie.mal { color:var(--aviso); }

/* panel derecho */
.ln { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 9px;
  padding:5px 0; border-top:1px solid var(--papel-2); align-items:baseline; }
.ln:first-child { border-top:0; }
.ln .q { font-size:12px; }
.ln .v { font-family:var(--cifra); font-size:12.5px; font-variant-numeric:tabular-nums;
  white-space:nowrap; font-weight:500; }
.ln .v.ok { color:var(--ok); } .ln .v.no { color:var(--alerta); }
.ln p { grid-column:1/-1; margin:2px 0 0; font-size:10.5px; color:var(--suave); }
.ln .org { font-family:var(--cifra); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--linea); margin-left:5px; }
button.fte { font-family:var(--cifra); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; background:none; border:1px solid var(--linea);
  border-radius:2px; color:var(--suave); padding:0 4px; cursor:pointer; margin-left:5px; }
button.fte:hover { color:var(--acero); border-color:var(--acero); }
.tarj { border:1px solid var(--linea); border-left:3px solid var(--acero);
  border-radius:3px; background:var(--papel); padding:9px 10px; margin-bottom:11px; }
.tarj.bien { border-left-color:var(--ok); }
.tarj > h4 { font-family:var(--disp); font-size:13.5px; margin:0 0 1px; }
.tarj > .sub { font-family:var(--cifra); font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--suave); margin:0 0 7px; }

/* avisos · las guardas */
.guarda { border:1px solid var(--aviso); border-left:3px solid var(--aviso);
  border-radius:3px; background:var(--papel); padding:9px 10px; margin-bottom:9px; }
.guarda b { color:var(--aviso); font-size:12px; }
.guarda pre { font-family:var(--cifra); font-size:10.5px; white-space:pre-wrap;
  margin:4px 0 0; color:var(--tinta-2); }

.nohay { color:var(--suave); font-style:italic; font-size:12.5px; padding:14px 2px; }
.todavia { border:1px solid var(--linea); border-left:3px solid var(--aviso);
  border-radius:3px; background:var(--ficha); padding:13px 15px; font-size:13px;
  color:var(--tinta-2); max-width:70ch; }
.todavia b { color:var(--aviso); }
/* ---- EL TABLERO Y LA LISTA DE AVISOS · los pasos que no llevan dibujo
   no llevan lienzo: llevan pagina, y una pagina quiere ancho ---- */
.hoja { padding:20px 26px 40px; overflow:auto; max-width:1180px; width:100%;
  margin:0 auto; box-sizing:border-box; }
/* una pagina sin lados NO se pega a la izquierda: va centrada, y el aviso de
   «todavia no» ocupa su ancho en vez de quedarse en una columna estrecha */
.hoja .todavia { max-width:none; }
.hoja > h2 { font-family:var(--disp); font-size:19px; font-weight:600;
  margin:0 0 3px; letter-spacing:-.01em; }
.hoja > p.lead { color:var(--suave); font-size:12.5px; margin:0 0 18px; }
.rejilla { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(265px,1fr)); }
.rejilla .tarj { margin:0; }
ol.avisos { list-style:none; margin:0; padding:0; }
ol.avisos li { border:1px solid var(--linea); border-left:3px solid var(--linea);
  border-radius:2px; padding:9px 12px 10px; margin-bottom:8px; }
ol.avisos li.error { border-left-color:var(--alerta); }
ol.avisos li.aviso { border-left-color:var(--aviso); }
ol.avisos li.nota  { border-left-color:var(--suave); }
ol.avisos .niv { font-family:var(--cifra); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; margin-right:8px; }
ol.avisos li.error .niv { color:var(--alerta); }
ol.avisos li.aviso .niv { color:var(--aviso); }
ol.avisos li.nota  .niv { color:var(--suave); }
ol.avisos b { font-family:var(--disp); font-size:13px; font-weight:600; }
ol.avisos p { margin:5px 0 0; font-size:12.5px; color:var(--tinta-2);
  line-height:1.5; max-width:76ch; }
ol.avisos .cuales { font-family:var(--cifra); font-size:10.5px; color:var(--suave);
  margin-top:4px; }
ol.avisos .ir { font-family:var(--disp); font-size:11px; font-weight:600;
  margin-top:7px; padding:2px 8px; border:1px solid var(--linea);
  background:var(--papel); color:var(--acero); cursor:pointer; border-radius:2px; }
ol.avisos .ir:hover { border-color:var(--acero); }
.cuenta { display:flex; gap:7px; margin:0 0 16px; }
.cuenta span { font-family:var(--cifra); font-size:10px; padding:3px 9px;

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var BUILD = window.GALPON_BUILD || "—";
  $("build").textContent = BUILD;

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function n2(x, d) {
    d = d === undefined ? 2 : d;
    return (Math.round(x * Math.pow(10, d)) / Math.pow(10, d))
      .toFixed(d).replace(".", ",");
  }
  function lista(s) {
    return String(s || "").split(/[,;\s]+/).filter(function (x) { return x !== ""; })
      .map(Number).filter(function (x) { return !isNaN(x); });
  }

  /* ---------- LOS PASOS Y SU ARMAZON ----------

     ESTABA MAL Y SE VEIA. La barra de vistas -Portico, Planta, Elevacion,
     3D- y el panel de la izquierda -Ver y Datos- son de GEOMETRIA, y se
     colaban en los once pasos. Al entrar en Cargas seguias viendo las
     capas de barras y los parametros del tijeral, que alli no pintan nada:
     el armazon de un paso parecia el de todos porque era el de todos.

     Y la lista de pasos estaba AQUI, a mano, duplicada de vistas.js: dos
     copias de la misma lista en dos archivos es la que se desincroniza.
     Ahora la lista y el armazon de cada paso salen del modulo, que es
     donde se pueden comprobar sin abrir un navegador. */
  var PASOS = VISTAS.PASOS;
  var pasoActivo = "geom";
  var insignia = null;

  function pintaPasos() {
    var html = "", grupo = null, abierto = false;
    PASOS.forEach(function (p) {
      if (p.grupo !== grupo) {
        if (abierto) html += "</div></div>";
        html += '<div class="grupo"><span>' + esc(p.grupo) + "</span><div>";
        grupo = p.grupo; abierto = true;
      }
      var ins = (p.id === "comprob" && insignia) ?
        '<span class="ins">' + insignia + "</span>" : "";
      html += '<button data-paso="' + p.id + '"' +
        (p.listo ? "" : ' class="falta"') +
        ' aria-selected="' + (p.id === pasoActivo) + '">' + esc(p.nombre) +
        ins + "</button>";
    });
    $("pasos").innerHTML = html + "</div></div>";
  }
  pintaPasos();

  function vePaso(id) {
    pasoActivo = id;
    pintaPasos();
    recalcula();
  }

  $("plegar").onclick = function () { plegada = !plegada; armaChrome(); };

  $("pasos").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-paso]") : null;
    if (b) vePaso(b.getAttribute("data-paso"));
  });

  /* EL ARMAZON · lo monta el paso, no la costumbre. Un paso que no declara
     «vistas» no ensena la barra de vistas, y uno que no declara ningun lado
     no ensena el panel de la izquierda: se queda el ancho entero, que es lo
     que una pagina de avisos o un tablero necesitan. */
  var plegada = false;
  function armaChrome() {
    var a = VISTAS.armazon(pasoActivo);
    $("vistas").hidden = !a.vistas;
    $("metricas").hidden = !a.vistas;
    var ver = a.lados.indexOf("ver") >= 0;
    var par = a.lados.indexOf("parametros") >= 0;
    $("lado-ver").hidden = !ver;
    $("lado-parametros").hidden = !par;
    $("lado-datos").hidden = a.lados.indexOf("datos") < 0;
    $("lado-cargas").hidden = a.lados.indexOf("cargas") < 0;
    $("lado-analisis").hidden = a.lados.indexOf("analisis") < 0;
    $("lado-diseno").hidden = a.lados.indexOf("diseno") < 0;
    $("lado-cimen").hidden = a.lados.indexOf("cimen") < 0;
    $("izquierda").hidden = !a.lados.length;
    $("derecha").hidden = !a.derecha;
    /* los formularios, en franja arriba; Geometría (ver y parámetros), en columna */
    var banda = a.lados.length && !ver && !par;
    $("obra").className = "obra" + (a.lados.length ? "" : " sin-izq") +
      (a.derecha ? "" : " sin-der") + (banda ? " banda" + (plegada ? " plegada" : "") : "") +
      (pasoActivo === "datos" ? " en-datos" : "");
    if (banda) {
      $("banda-tit").textContent = "Datos de " + VISTAS.paso(pasoActivo).nombre.toLowerCase();
      $("plegar").textContent = plegada ? "mostrar los datos" : "ocultar los datos";
    }
    return a;
  }

  /* ---------- INICIO · el tablero -----------------------------------
     El primer paso puede estar lleno hoy porque no calcula nada nuevo:
     dice que hay en el libro y que falta. */
  function pintaInicio(fallo) {
    var f = VISTAS.inicio(m3, modelo);
    $("centro").innerHTML = '<div class="hoja"><h2>Galpón</h2>' +
      '<p class="lead">' + (m3
        ? "lo que hay en este libro, y en qué paso está"
        : "el galpón no se puede montar con los datos de ahora: " +
          esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.") + "</p>" +
      '<div class="rejilla">' + f.map(pintaFicha).join("") + "</div></div>";
  }

  /* ---------- COMPROBACION · lo que las guardas tienen que decir -----
     Las guardas de los modulos LANZAN cuando algo es imposible, y eso se
     ve enseguida. Lo que no se ve es lo que es legal pero cuesta: el alero
     a axial, los metros que no dilatan, las clases sin perfil. */
  /* LO QUE EL ANÁLISIS, EL DISEÑO Y LA CIMENTACIÓN DE LOS DOS PÓRTICOS TIENEN QUE
     DECIR.  Antes Comprobación solo leía lo ya calculado; con dos pórticos eso
     dejaba fuera el que no se hubiera abierto, así que pide los dos a la caché
     (que calcula si hace falta: unos cientos de ms) */
  function conResultados(c) {
    var extra = [];
    if (m3) {
      RESULTADOS.PORTICOS.forEach(function (p) {
        analisisActual(p); disenoActual(p); cimenActual(p);
        extra = extra.concat(RESULTADOS.avisosResultados(analisisVigente(p), disenoVigente(p), cimenVigente(p)));
      });
      ["arriostrado", "hastial"].forEach(function (t) {
        cimenActual(t);
        extra = extra.concat(RESULTADOS.avisosResultados(null, null, cimenVigente(t)));
      });
      extra = extra.concat(RESULTADOS.avisosLongitudinal(largoActual()));
      extra = extra.concat(RESULTADOS.avisosCorreas(correasActual()));
      RESULTADOS.PORTICOS.forEach(function (p) { extra = extra.concat(RESULTADOS.avisosConexiones(conexActual(p))); });
    }
    if (!extra.length) return c;
    var lista = extra.concat(c.lista);
    var cuenta = { error: 0, aviso: 0, nota: 0 };
    lista.forEach(function (a) { cuenta[a.nivel]++; });
    return Object.assign({}, c, { lista: lista, cuenta: cuenta, total: lista.length,
      insignia: cuenta.error + cuenta.aviso,
      nota: cuenta.error ? "hay " + cuenta.error + " cosa(s) que impiden seguir" : c.nota });
  }

  function pintaComprobacion(fallo) {
    if (!m3) {
      /* si el galpon no se monta, ESO es lo primero que hay que comprobar */
      insignia = 1; pintaPasos();
      $("centro").innerHTML = '<div class="hoja"><h2>Comprobación</h2>' +
        '<p class="lead">hay 1 cosa que impide seguir</p>' +
        '<ol class="avisos"><li class="error"><span class="niv">error</span><b>' +
        esc(fallo ? fallo.titulo : "el galpón no se puede montar") + "</b>" +
        (fallo ? "<p>" + esc(fallo.mensaje) + "</p>" : "") +
        '<button class="ir" data-ir="geom">ir a Geometría</button></li></ol></div>';
      return;
    }
    var c = conResultados(VISTAS.comprobacion(m3, modelo));
    insignia = c.insignia || null;
    pintaPasos();
    var cu = '<div class="cuenta">' +
      (c.cuenta.error ? '<span class="e">' + c.cuenta.error + " error(es)</span>" : "") +
      (c.cuenta.aviso ? '<span class="a">' + c.cuenta.aviso + " aviso(s)</span>"
        : '<span class="ok">ningún aviso</span>') +
      '<span>' + c.cuenta.nota + " nota(s)</span></div>";
    $("centro").innerHTML = '<div class="hoja"><h2>Comprobación</h2>' +
      '<p class="lead">' + esc(c.nota) + "</p>" + cu +
      '<ol class="avisos">' + c.lista.map(function (a) {
        return '<li class="' + a.nivel + '"><span class="niv">' + a.nivel +
          "</span><b>" + esc(a.que) + "</b>" +
          (a.fuente ? fuenteBtn(a.fuente) : "") +
          (a.porque ? "<p>" + esc(a.porque) + "</p>" : "") +
          (a.cuales && a.cuales.length
            ? '<div class="cuales">' + esc(a.cuales.join("  ·  ")) + "</div>" : "") +
          (a.paso ? '<button class="ir" data-ir="' + a.paso + '">ir a ' +
            esc(VISTAS.paso(a.paso).nombre) + "</button>" : "") +
          "</li>";
      }).join("") + "</ol></div>";
  }

  $("centro").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-ir]") : null;
    if (b) vePaso(b.getAttribute("data-ir"));
  });

  /* ---------- LOS FORMULARIOS DE CARGAS Y ANALISIS ----------
     Los campos salen de resultados.js, que dice a qué clave del modelo va
     cada uno. Ninguno trae valor: un campo vacío se queda sin poner y la
     pantalla lo pide, en vez de rellenarse con un número que nadie eligió. */
  function campoSitio(c, pref) {
    var cid = pref + c.id;
    var et = esc(c.etiqueta) + (c.unidad ? " (" + esc(c.unidad) + ")" : "") +
      (c.fuente ? fuenteBtn(c.fuente) : "");
    var envol = '<div class="par ancho"' + (c.soloSi ? ' data-solo="' + c.soloSi + '"' : "") + ">";
    if (c.tipo === "opcion") {
      return envol + '<label for="' + cid + '">' + et + '</label><select id="' + cid + '">' +
        c.opciones.map(function (o) {
          return '<option value="' + o[0] + '">' + esc(o[1]) + "</option>";
        }).join("") + "</select></div>";
    }
    /* LO QUE SALE SOLO: no se escribe; fijosDatos() lo calcula y pintaFijos() lo pone */
    if (c.tipo === "fijo") {
      return '<div class="par fijo"><span class="et">' + et + '</span><b id="fx_' + c.id + '">—</b>' +
        '<small id="fxn_' + c.id + '"></small></div>';
    }
    /* EL DISTRITO: se busca por palabras y se elige; la zona sale de él · fila S.zona.distrito */
    if (c.tipo === "distrito") {
      return envol + '<label for="' + cid + '">' + et + '</label>' +
        '<input type="text" id="' + cid + 'bus" placeholder="busca: departamento, provincia, distrito o ciudad" value="">' +
        '<select id="' + cid + '"><option value="">— escribe arriba para buscar —</option></select></div>';
    }
    if (c.tipo === "texto") {
      return envol + '<label for="' + cid + '">' + et + '</label><input type="text" id="' + cid + '" value=""></div>';
    }
    return envol + '<label for="' + cid + '">' + et + '</label><input type="number" id="' +
      cid + '" step="any" value=""></div>';
  }
  function pintaForm(id, grupos, pref) {
    $(id).innerHTML = grupos.map(function (g) {
      return "<fieldset><legend>" + esc(g.grupo) + "</legend>" +
        g.campos.map(function (c) { return campoSitio(c, pref); }).join("") + "</fieldset>";
    }).join("");
  }
  function valoresForm(grupos, pref) {
    var v = {};
    grupos.forEach(function (g) {
      g.campos.forEach(function (c) { if (c.tipo === "fijo") return; var el = $(pref + c.id); v[c.id] = el ? el.value : ""; });
    });
    return v;
  }
  function ponValores(grupos, pref, v) {
    grupos.forEach(function (g) {
      g.campos.forEach(function (c) {
        var el = $(pref + c.id);
        if (el) el.value = (v[c.id] === undefined) ? "" : v[c.id];
      });
    });
  }
  pintaForm("fp", RESULTADOS.CAMPOS_PROYECTO, "pr_");
  pintaForm("fe", RESULTADOS.CAMPOS_EDIFICACION, "ed_");
  pintaForm("fc", RESULTADOS.CAMPOS_CARGAS, "ca_");
  pintaForm("fm", RESULTADOS.CAMPOS_MATERIALES, "ma_");
  pintaForm("fcp", RESULTADOS.CAMPOS_PERMANENTES, "cp_");
  pintaForm("fa", RESULTADOS.CAMPOS_ANALISIS, "an_");
  pintaForm("fd", RESULTADOS.CAMPOS_DISENO, "di_");
  pintaForm("fci", RESULTADOS.CAMPOS_CIMENTACION, "ci_");

  /* LOS CAMPOS QUE DEPENDEN DE OTRO · soloSi: "campo=valor".  El de la nieve
     básica solo con nieve; el de la soldadura solo con uniones soldadas. */
  function actualizaSolos() {
    var pref = { fd: "di_", fe: "ed_", fcp: "cp_" };
    for (var f in pref) {
      var form = $(f);
      if (!form || !form.querySelectorAll) continue;
      Array.prototype.forEach.call(form.querySelectorAll("[data-solo]"), function (el) {
        var q = el.getAttribute("data-solo").split("=");
        var otro = $(pref[f] + q[0]);
        el.hidden = !(otro && q[1].split("|").indexOf(otro.value) >= 0);
      });
    }
  }
  $("fd").addEventListener("change", function () {
    modelo.diseno = RESULTADOS.leeDiseno(valoresForm(RESULTADOS.CAMPOS_DISENO, "di_"));
    actualizaSolos();
    recalcula();
  });
  $("fp").addEventListener("change", function () {
    modelo.proyecto = RESULTADOS.leeProyecto(valoresForm(RESULTADOS.CAMPOS_PROYECTO, "pr_"));
    recalcula();
  });
  /* EL SITIO se lee de los tres formularios de Datos (sitio, materiales, cargas permanentes), y LA
     CIMENTACIÓN de su paso y de Materiales: los datos viven donde se piden, y se guardan donde siempre */
  function valoresDatos() {
    return Object.assign({}, valoresForm(RESULTADOS.CAMPOS_EDIFICACION, "ed_"),
      valoresForm(RESULTADOS.CAMPOS_MATERIALES, "ma_"), valoresForm(RESULTADOS.CAMPOS_PERMANENTES, "cp_"));
  }
  function sitioDeFormularios() {
    var v = valoresDatos();
    return Object.assign(RESULTADOS.leeSitio(v), RESULTADOS.leeEdificacion(v));
  }
  function cimentacionDeFormularios() {
    return RESULTADOS.leeCimentacion(Object.assign({}, valoresForm(RESULTADOS.CAMPOS_CIMENTACION, "ci_"),
      valoresForm(RESULTADOS.CAMPOS_MATERIALES, "ma_")));
  }
  $("fci").addEventListener("change", function () {
    modelo.cimentacion = cimentacionDeFormularios();
    recalcula();
  });
  $("fm").addEventListener("change", function () {
    modelo.sitio = sitioDeFormularios();
    modelo.cimentacion = cimentacionDeFormularios();
    recalcula();
  });
  $("fcp").addEventListener("change", function () {
    modelo.sitio = sitioDeFormularios();
    actualizaSolos();
    recalcula();
  });
  /* las pestañas de Datos: solo enseñan otra tarjeta, no recalculan */
  var subDatos = "sitio";
  function ponSubDatos(k) {
    subDatos = k;
    ["sitio", "mat", "perm"].forEach(function (x) {
      $("sub-" + x).hidden = x !== k;
    });
    var bs = $("subdatos").querySelectorAll ? $("subdatos").querySelectorAll("button[data-sub]") : [];
    Array.prototype.forEach.call(bs, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-sub") === k)); });
  }
  $("subdatos").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-sub]") : null;
    if (b) ponSubDatos(b.getAttribute("data-sub"));
  });
  /* los valores que salen solos */
  function pintaFijos() {
    var F = RESULTADOS.fijosDatos(modelo, m3, PERFILES);
    for (var k in F) {
      if ($("fx_" + k)) $("fx_" + k).textContent = F[k].v;
      if ($("fxn_" + k)) $("fxn_" + k).textContent = F[k].nota;
    }
  }
  /* el buscador de distritos rehace solo las opciones, sin repintar el panel */
  function opcionesDistrito(texto) {
    var sel = $("ed_dist");
    if (!sel) return;
    var actual = (modelo.sitio || {}).distrito || "";
    var lista = UBICACION.buscar(texto, 60);
    if (actual && lista.indexOf(actual) < 0) lista.unshift(actual);
    sel.innerHTML = (lista.length ? "" : '<option value="">' + (texto ? "— no hay ningún distrito así —" :
      "— escribe arriba para buscar —") + "</option>") +
      (actual ? "" : (lista.length ? '<option value="">— elige el distrito —</option>' : "")) +
      lista.map(function (k) {
        return '<option value="' + esc(k) + '"' + (k === actual ? " selected" : "") + ">" + esc(UBICACION.etiqueta(k)) + "</option>";
      }).join("");
  }
  if ($("ed_distbus") && $("ed_distbus").addEventListener) {
    $("ed_distbus").addEventListener("input", function () { opcionesDistrito(this.value); });
  }
  $("fe").addEventListener("change", function () {
    modelo.sitio = sitioDeFormularios();
    actualizaSolos();
    recalcula();
  });

  $("fa").addEventListener("change", function () {
    modelo.sistema = RESULTADOS.leeSistema(valoresForm(RESULTADOS.CAMPOS_ANALISIS, "an_"));
    recalcula();
  });
  function ponSitioEnFormularios() {
    ponValores(RESULTADOS.CAMPOS_PROYECTO, "pr_", RESULTADOS.valoresDeProyecto(modelo.proyecto));
    opcionesDistrito("");
    var vs = RESULTADOS.valoresDeSitio(modelo.sitio);
    ponValores(RESULTADOS.CAMPOS_EDIFICACION, "ed_", Object.assign({}, vs, RESULTADOS.valoresDeEdificacion(modelo.sitio)));
    ponValores(RESULTADOS.CAMPOS_MATERIALES, "ma_", Object.assign({}, vs, RESULTADOS.valoresDeCimentacion(modelo.cimentacion)));
    ponValores(RESULTADOS.CAMPOS_PERMANENTES, "cp_", vs);
    ponValores(RESULTADOS.CAMPOS_ANALISIS, "an_", modelo.sistema || {});
    ponValores(RESULTADOS.CAMPOS_DISENO, "di_", RESULTADOS.valoresDeDiseno(modelo.diseno));
    ponValores(RESULTADOS.CAMPOS_CIMENTACION, "ci_", RESULTADOS.valoresDeCimentacion(modelo.cimentacion));
    actualizaSolos();
  }

  function listaFaltas(faltas, conIr) {
    return '<ol class="avisos">' + faltas.map(function (f) {
      var p = conIr && f.paso && f.paso !== pasoActivo ? VISTAS.paso(f.paso) : null;
      return '<li class="aviso"><span class="niv">falta</span><b>' + esc(f.que) + "</b>" +
        (f.fuente ? fuenteBtn(f.fuente) : "") +
        (p ? '<button class="ir" data-ir="' + p.id + '">ir a ' + esc(p.nombre) + "</button>" : "") +
        "</li>";
    }).join("") + "</ol>";
  }

  /* ---------- CARGAS ---------- */
  function pintaCargas(fallo) {
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Cargas</h2><p class="lead">el galpón no ' +
        "se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      return;
    }
    var c = RESULTADOS.cargas(m3, modelo.sitio);
    var faltas = c.faltan.map(function (f) { return { que: f.que, paso: f.paso }; });
    var h = '<div class="hoja"><h2>Cargas</h2><p class="lead">' +
      (c.completo ? "todo definido: el análisis tiene con qué correr"
        : "faltan " + faltas.length + " dato(s), que se piden a la izquierda") + "</p>" +
      (faltas.length ? listaFaltas(faltas, true) : "") +
      '<div class="rejilla">' + c.fichas.map(pintaFicha).join("") + "</div>";
    if (c.tablaViento.length) {
      h += "<h3>Viento por superficie</h3><div class=\"tarj\"><table class=\"rx\"><thead><tr>" +
        "<th>Dirección</th><th>Superficie</th><th>Ce</th><th>Ci</th><th>C</th><th>Ph (kgf/m²)</th>" +
        "</tr></thead><tbody>" + c.tablaViento.map(function (r) {
          return "<tr><td>" + esc(r.direccion) + "</td><td>" + esc(r.superficie) + "</td><td>" +
            n2(r.Ce, 2) + "</td><td>" + n2(r.Ci, 2) + "</td><td>" + n2(r.C, 2) +
            '</td><td class="' + (r.Ph_kgfm2 < 0 ? "neg" : "") + '">' + n2(r.Ph_kgfm2, 1) + "</td></tr>";
        }).join("") + "</tbody></table><p class=\"pie\">Presiones y succiones exteriores " +
        "simultáneas (E.020 Art. 12.1). Naranja levanta.</p></div>";
    }
    if (c.combinaciones) {
      var lis = function (l) {
        return '<ul class="combs">' + l.map(function (x) {
          return '<li><span class="id">' + esc(x.id) + "</span>" + esc(x.texto) + "</li>";
        }).join("") + "</ul>";
      };
      h += '<h3>Combinaciones</h3><div class="dos"><div class="tarj"><h4>Acero · E.090</h4>' +
        lis(c.combinaciones.acero) + '</div><div class="tarj"><h4>Cimentación · E.060</h4>' +
        lis(c.combinaciones.concreto) + '<p class="pie">A la cimentación se le pasan los casos ' +
        "sin factorizar y combina con sus propios factores (fila J.costura).</p></div></div>";
    }
    $("centro").innerHTML = h + "</div>";
  }

  /* ---------- ANALISIS ----------
     Corre cuando se entra en el paso o cambia algo de lo que depende. La
     cámara de Geometría no cuenta: el resultado se guarda con una clave de
     todo lo que lo determina y se reutiliza mientras no cambie. */
  /* EL PÓRTICO QUE SE ENSEÑA · fila A.portico.tipico.  Análisis, Diseño y
     Cimentación enseñan uno, y cada uno tiene su caché; Comprobación pide
     los dos. */
  var porticoSel = "interior";
  var NOMBRE_PORTICO = { interior: "pórtico interior", fachada: "pórtico de fachada", longitudinal: "a lo largo",
    correas: "correas" };
  function selPortico(conLargo, conCorreas) {
    var lista = RESULTADOS.PORTICOS.concat(conLargo ? ["longitudinal"] : []).concat(conCorreas ? ["correas"] : []);
    return '<div class="modos" role="group" aria-label="pórtico">' +
      lista.map(function (p) {
        return '<button type="button" data-portico="' + p + '" aria-pressed="' + (p === porticoSel) + '">' +
          NOMBRE_PORTICO[p] + "</button>";
      }).join("") + "</div>";
  }
  /* «a lo largo», «correas» y las zapatas que no son de pórtico usan el pórtico interior */
  function porticoMarco() { return porticoSel === "fachada" ? "fachada" : "interior"; }
  /* LA ZAPATA QUE SE ENSEÑA · fila ZT.tipos */
  var NOMBRE_ZAPATA = { interior: "pórtico interior", arriostrado: "paño arriostrado", fachada: "pórtico de fachada",
    hastial: "columna hastial" };
  function zapataSel() { return RESULTADOS.TIPOS_ZAPATA.indexOf(porticoSel) >= 0 ? porticoSel : "interior"; }
  function selZapata() {
    return '<div class="modos" role="group" aria-label="zapata">' +
      RESULTADOS.TIPOS_ZAPATA.map(function (p) {
        return '<button type="button" data-portico="' + p + '" aria-pressed="' + (p === zapataSel()) + '">' +
          NOMBRE_ZAPATA[p] + "</button>";
      }).join("") + "</div>";
  }
  var analisisCache = {};
  var modoAnalisis = "compresion";
  function claveAnalisis() {
    return JSON.stringify([paraElMotor(VISTAS.datosModelo(datos())), modelo.secciones,
      modelo.sitio, modelo.sistema]);
  }
  function analisisActual(p) {
    p = p || porticoMarco();
    var k = claveAnalisis(), c = analisisCache[p];
    if (!c || c.clave !== k) {
      c = analisisCache[p] = { clave: k, res: RESULTADOS.analisis(m3, modelo, PERFILES, p) };
    }
    return c.res;
  }
  function analisisVigente(p) {
    var c = analisisCache[p || porticoMarco()];
    return c && c.clave === claveAnalisis() && c.res && c.res.ok ? c.res : null;
  }

  function dibujaFuerzas(dj, r) {
    var pos = {}, xs = [], ys = [];
    dj.nudos.forEach(function (nd) { pos[nd.id] = nd; xs.push(nd.x_m); ys.push(nd.y_m); });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var W = 1000, m = 48, k = (W - 2 * m) / Math.max(x1 - x0, 1e-6);
    var H = (y1 - y0) * k + 2 * m + 20;
    if (H > 600) { k = (600 - 2 * m - 20) / (y1 - y0); H = 600; }
    var X = function (x) { return m + (x - x0) * k; };
    var Y = function (y) { return H - m - (y - y0) * k; };
    var h = '<svg class="fz" viewBox="0 0 ' + W + " " + n2(H, 0).replace(",", ".") + '">';
    dj.barras.forEach(function (b) {
      var a = pos[b.i], c = pos[b.j];
      var cls = b.cls || (dj.modo === "momento" ? (Math.abs(b.valor) > 1e-6 ? "m" : "n")
        : (b.valor > 1e-6 ? "t" : (b.valor < -1e-6 ? "c" : "n")));
      var sw = 1 + 6 * b.peso;
      var xy = ' x1="' + X(a.x_m).toFixed(1) + '" y1="' + Y(a.y_m).toFixed(1) + '" x2="' +
        X(c.x_m).toFixed(1) + '" y2="' + Y(c.y_m).toFixed(1) + '"';
      if (b.id === barraSel) h += '<line class="sel"' + xy + ' stroke-width="' + (sw + 5) + '"/>';
      h += '<line class="' + cls + '"' + xy + ' stroke-width="' + sw.toFixed(2) + '" stroke-linecap="round"/>';
      h += '<line data-barra="' + esc(b.id) + '"' + xy +
        ' stroke="transparent" stroke-width="12" style="cursor:pointer"/>';
      if (b.etiqueta && (b.peso >= 0.12 || dj.modo === "ratio")) {
        h += '<text x="' + ((X(a.x_m) + X(c.x_m)) / 2 + 4).toFixed(1) + '" y="' +
          ((Y(a.y_m) + Y(c.y_m)) / 2 - 4).toFixed(1) + '">' + esc(b.etiqueta) + "</text>";
      }
    });
    /* los apoyos, dibujados según el sistema */
    dj.nudos.forEach(function (nd) {
      if (nd.clase !== "base") return;
      var px = X(nd.x_m), py = Y(nd.y_m);
      h += r.sistema.base === "empotrada"
        ? '<path class="apoyo" d="M' + (px - 14) + " " + py + "h28M" + (px - 12) + " " + py +
          "l-6 8M" + (px - 2) + " " + py + "l-6 8M" + (px + 8) + " " + py + 'l-6 8"/>'
        : '<path class="apoyo" d="M' + px + " " + py + "l-9 14h18z\"/>";
    });
    return h + "</svg>";
  }

  function pintaAnalisis(fallo) {
    if (porticoSel === "correas" || porticoSel === "arriostrado" || porticoSel === "hastial") porticoSel = "interior";
    if (porticoSel === "longitudinal") { pintaLongitudinal("analisis", fallo); return; }
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Análisis</h2>' + selPortico(true) + '<p class="lead">el galpón no ' +
        "se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var a = analisisActual();
    if (!a.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>Análisis</h2>' + selPortico(true) + '<p class="lead">todavía no ' +
        "se puede correr: falta lo que sigue, y cada cosa dice dónde se pone</p>" +
        listaFaltas(a.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">El análisis resuelve el pórtico que se elija arriba —interior o de fachada— ' +
        "con el Método Directo: todas las combinaciones de la E.090, el viento como estados " +
        "físicos y el segundo orden del Apéndice 8.</p>";
      return;
    }
    var r = a.r;
    var dj = RESULTADOS.dibujo(r, m3, modoAnalisis);
    var modos = '<div class="modos">' + dj.modos.map(function (x) {
      return '<button type="button" data-modo="' + x[0] + '" aria-pressed="' +
        (x[0] === dj.modo) + '">' + esc(x[1]) + "</button>";
    }).join("") + "</div>";
    var ley = '<div class="ley">' + (dj.modo === "momento"
      ? '<span><i style="border-top-color:var(--aviso)"></i>' + esc(dj.leyenda) + "</span>"
      : '<span><i style="border-top-color:var(--acero)"></i>tracción</span>' +
        '<span><i style="border-top-color:var(--alerta)"></i>compresión</span>' +
        "<span>" + esc(dj.leyenda) + "</span>") +
      "<span>máx. " + n2(dj.modo === "momento" ? dj.max / 1e5 : dj.max / 1000, 2) + " " + dj.unidad +
      "</span></div>";
    $("centro").innerHTML = '<div class="hoja"><h2>Análisis</h2>' + selPortico(true) + '<p class="lead">' +
      esc(r.sistema.nombre) + " · " + (r.fachada ? "pórtico de fachada" : "pórtico interior") + ", eje " + r.eje + " · " +
      r.combinaciones.length + " corridas</p>" + modos + dibujaFuerzas(dj, r) + ley + "</div>";

    var sel;
    var lf = barraSel ? RESULTADOS.lineasFuerzas(r, barraSel) : null;
    if (lf) {
      sel = '<div class="tarj" style="border-left-color:var(--alerta)"><h4>' +
        esc(barraSel.split("@")[0]) + '</h4><p class="sub">' + esc(lf.nota) + "</p>" +
        lf.lineas.map(pintaLinea).join("") + "</div>";
    } else {
      sel = '<div class="tarj"><h4>Nada seleccionado</h4><p class="sub">pincha una barra del dibujo</p></div>';
    }
    var tr = RESULTADOS.tablaReacciones(r);
    var t = function (x) { return n2(x / 1000, 2); };
    var tabla = '<div class="tarj"><h4>Reacciones por caso</h4><p class="sub">sin factorizar · ' +
      "para la cimentación · t y t·m</p>" +
      '<div class="rueda-x"><table class="rx"><thead><tr><th>caso</th><th>Rx izq</th><th>Ry izq</th><th>Mz izq</th>' +
      "<th>Rx der</th><th>Ry der</th><th>Mz der</th></tr></thead><tbody>" +
      tr.map(function (x) {
        return '<tr title="' + esc(x.desc) + '"><td>' + esc(x.caso) + "</td><td>" + t(x.B0.Rx) +
          "</td><td>" + t(x.B0.Ry) + "</td><td>" + n2(x.B0.Mz / 1e5, 2) + "</td><td>" + t(x.B1.Rx) +
          "</td><td>" + t(x.B1.Ry) + "</td><td>" + n2(x.B1.Mz / 1e5, 2) + "</td></tr>";
      }).join("") + "</tbody></table></div>" + '<p class="pie">' + fuenteBtn("A.reacciones.casos") +
      " A la cimentación se le pasan casos, no combinaciones.</p></div>";
    var avisos = '<div class="tarj"><h4>Lo que este análisis todavía no cubre</h4>' +
      r.avisos.map(function (x) { return '<p class="pie">' + esc(x) + "</p>"; }).join("") + "</div>";
    $("derecha").innerHTML = sel + a.fichas.map(pintaFicha).join("") + tabla + avisos;
  }

  $("centro").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-modo]") : null;
    if (b) { modoAnalisis = b.getAttribute("data-modo"); recalcula(); }
    var q = ev.target.closest ? ev.target.closest("button[data-portico]") : null;
    if (q) { porticoSel = q.getAttribute("data-portico"); barraSel = null; recalcula(); }
  });

  /* ---------- DISEÑO ----------
     Usa el análisis vigente —el de la caché— y verifica cada barra. Lo que
     no se pudo comprobar sale en naranja discontinuo y la barra NO cumple. */
  var disenoCache = {};
  function disenoActual(p) {
    p = p || porticoMarco();
    var k = claveAnalisis() + JSON.stringify(modelo.diseno || {}), c = disenoCache[p];
    if (!c || c.clave !== k) {
      c = disenoCache[p] = { clave: k, res: RESULTADOS.diseno(m3, modelo, PERFILES, analisisActual(p)) };
    }
    return c.res;
  }
  function disenoVigente(p) {
    var k = claveAnalisis() + JSON.stringify(modelo.diseno || {}), c = disenoCache[p || porticoMarco()];
    return c && c.clave === k && c.res && c.res.ok ? c.res : null;
  }

  function pintaDiseno(fallo) {
    if (porticoSel === "arriostrado" || porticoSel === "hastial") porticoSel = "interior";
    if (porticoSel === "longitudinal") { pintaLongitudinal("diseno", fallo); return; }
    if (porticoSel === "correas") { pintaCorreas(fallo); return; }
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">el galpón no ' +
        "se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var d = disenoActual();
    if (!d.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">todavía no se ' +
        "puede verificar: falta lo que sigue</p>" + listaFaltas(d.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">El diseño compara las fuerzas de segundo orden del ' +
        "análisis con la capacidad de cada barra, por su capítulo del AISC 360-22. Lo que no se " +
        "puede comprobar no cuenta como comprobado.</p>";
      return;
    }
    var dj = RESULTADOS.dibujoDiseno(d, m3);
    var R = d.v.resumen;
    var ley = '<div class="ley"><span><i style="border-top-color:var(--ok)"></i>cumple</span>' +
      '<span><i style="border-top-color:var(--alerta)"></i>ratio mayor que 1</span>' +
      '<span><i style="border-top-color:var(--aviso);border-top-style:dashed"></i>falta un control esencial</span>' +
      "<span>" + esc(dj.leyenda) + "</span></div>";
    var filas = RESULTADOS.tablaDiseno(d.v).map(function (c) {
      var cls = c.faltanEsenciales ? "neg" : (c.ratio > 1 ? "neg" : "");
      return "<tr><td>" + esc(c.clase) + "</td><td>" + esc(c.perfil) + '</td><td class="' + cls + '">' +
        (c.ratio === null ? "—" : n2(c.ratio, 2)) + (c.faltanEsenciales ? " ?" : "") + "</td><td>" +
        esc(c.barra) + "</td><td>" + (c.noCumplen ? c.noCumplen + " de " + c.cuantas : "todas") +
        "</td><td>" + esc(c.combo || "") + "</td></tr>";
    }).join("");
    $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">' +
      R.cumplen + " de " + R.total + " barras cumplen · " + (d.r.fachada ? "pórtico de fachada" : "pórtico interior") + " · " + esc(d.r.sistema.nombre) + "</p>" +
      dibujaFuerzas(dj, d.r) + ley +
      '<h3>Por clase de barra</h3><div class="tarj"><div class="rueda-x"><table class="rx"><thead><tr>' +
      "<th>clase</th><th>perfil</th><th>ratio máx.</th><th>barra</th><th>no cumplen</th><th>combinación</th>" +
      "</tr></thead><tbody>" + filas + "</tbody></table></div>" +
      '<p class="pie">El perfil se cambia en la tabla de perfiles de Geometría; el análisis y el ' +
      "diseño se rehacen solos.</p></div></div>";

    var sel;
    var ld = barraSel ? RESULTADOS.lineasDiseno(d.v, barraSel) : null;
    if (ld) {
      sel = '<div class="tarj" style="border-left-color:' + (ld.cumple ? "var(--ok)" : "var(--alerta)") +
        '"><h4>' + esc(barraSel.split("@")[0]) + '</h4><p class="sub">' + esc(ld.nota) + "</p>" +
        ld.lineas.map(pintaLinea).join("") + "</div>";
    } else {
      sel = '<div class="tarj"><h4>Nada seleccionado</h4><p class="sub">pincha una barra del dibujo</p></div>';
    }
    $("derecha").innerHTML = sel + d.fichas.map(pintaFicha).join("");
  }

  /* ---------- CIMENTACIÓN · E8 ----------
     Usa los casos del análisis vigente. La zapata se dibuja en sección, en el
     plano del pórtico, con la presión de servicio que manda, y en planta con
     las barras. */
  var cimenCache = {};
  function claveCimen() { return claveAnalisis() + JSON.stringify(modelo.cimentacion || {}); }
  function cimenActual(p) {
    p = p || zapataSel();
    var k = claveCimen(), c = cimenCache[p];
    if (!c || c.clave !== k) {
      var an = analisisActual(p === "fachada" ? "fachada" : "interior");
      var lo = p === "interior" ? undefined : largoActual();
      c = cimenCache[p] = { clave: k, res: RESULTADOS.cimentacion(m3, modelo, PERFILES, an, p,
        lo && lo.ok ? lo : undefined) };
    }
    return c.res;
  }
  function cimenVigente(p) {
    var c = cimenCache[p || zapataSel()];
    return c && c.clave === claveCimen() && c.res && c.res.ok ? c.res : null;
  }

  function svgCimen(dc) {
    var W = 1000, m = 60, gap = 130;
    /* las dos vistas a la misma escala: la sección a la izquierda, la planta a la derecha */
    var arriba = dc.sobre + 10, abajo = dc.Df;
    var qmax = Math.max.apply(null, dc.presion.puntos.map(function (p) { return p[1]; }).concat([1e-9]));
    var k = (W - 2 * m - gap) / (dc.L + dc.L);
    var hq = 0.35 * dc.L * k;                       /* alto de la presión dibujada, en px */
    var H = (arriba + abajo) * k + hq + 2 * m;
    if (H > 560) { k = k * (560 - 2 * m - hq) / ((arriba + abajo) * k); H = 560; }
    var f = function (x) { return x.toFixed(1); };
    var x0 = m + dc.L * k / 2, y0 = m + arriba * k;  /* origen de la sección: eje, nivel del terreno */
    var X = function (x) { return x0 + x * k; }, Y = function (y) { return y0 + y * k; };
    var h = '<svg class="zp" viewBox="0 0 ' + W + " " + f(H) + '">';
    /* el terreno */
    h += '<line class="terreno" x1="' + f(X(-dc.L / 2 - 30)) + '" y1="' + f(Y(0)) + '" x2="' + f(X(dc.L / 2 + 30)) +
      '" y2="' + f(Y(0)) + '"/>';
    /* el pedestal y la zapata */
    h += '<rect class="conc" x="' + f(X(-dc.pedL / 2)) + '" y="' + f(Y(-dc.sobre)) + '" width="' + f(dc.pedL * k) +
      '" height="' + f((dc.sobre + dc.Df - dc.h) * k) + '"/>';
    h += '<rect class="conc" x="' + f(X(-dc.L / 2)) + '" y="' + f(Y(dc.Df - dc.h)) + '" width="' + f(dc.L * k) +
      '" height="' + f(dc.h * k) + '"/>';
    /* las barras del pedestal, bajando hasta la parrilla y con su gancho */
    var yb = Y(dc.Df - dc.rec);
    if (dc.pedestal) {
      var xb = dc.pedL / 2 - dc.pedestal.aEje, yt = Y(-dc.sobre + dc.pedestal.aEje), yg = yb - 3;
      [-1, 1].forEach(function (sg) {
        h += '<polyline class="varilla" points="' + f(X(sg * xb)) + "," + f(yt) + " " + f(X(sg * xb)) + "," + f(yg) +
          " " + f(X(sg * (xb + 15))) + "," + f(yg) + '"/>';
      });
      for (var jb = 1; jb <= dc.pedestal.ns; jb++) {
        var xs = -xb + 2 * xb * jb / (dc.pedestal.ns + 1);
        h += '<line class="varilla fina" x1="' + f(X(xs)) + '" y1="' + f(yt) + '" x2="' + f(X(xs)) + '" y2="' + f(yg) + '"/>';
      }
    }
    /* la placa y los pernos */
    if (dc.placa) {
      var tp = Math.max(dc.placa.t * k, 3), ytop = Y(-dc.sobre);
      h += '<rect class="placa" x="' + f(X(-dc.placa.N / 2)) + '" y="' + f(ytop - tp) + '" width="' + f(dc.placa.N * k) +
        '" height="' + f(tp) + '"/>';
      [-1, 1].forEach(function (sg) {
        h += '<line class="perno" x1="' + f(X(sg * dc.placa.f)) + '" y1="' + f(ytop - tp - 8) + '" x2="' +
          f(X(sg * dc.placa.f)) + '" y2="' + f(Y(-dc.sobre + dc.placa.Ld)) + '"/>';
      });
    }
    /* la parrilla de abajo, y la de arriba si hace falta */
    h += '<line class="barra" x1="' + f(X(-dc.L / 2 + dc.rec)) + '" y1="' + f(yb) + '" x2="' + f(X(dc.L / 2 - dc.rec)) +
      '" y2="' + f(yb) + '"/>';
    if (dc.barrasSup) {
      var ys = Y(dc.Df - dc.h + dc.rec);
      h += '<line class="barra" x1="' + f(X(-dc.L / 2 + dc.rec)) + '" y1="' + f(ys) + '" x2="' + f(X(dc.L / 2 - dc.rec)) +
        '" y2="' + f(ys) + '"/>';
    }
    /* la presión, colgada debajo de la zapata */
    var yq = Y(dc.Df);
    if (dc.presion.puntos.length) {
      var pts = dc.presion.puntos.map(function (p) { return f(X(p[0])) + "," + f(yq + p[1] / qmax * hq); });
      h += '<polygon class="pres' + (dc.presion.cumple ? "" : " no") + '" points="' + f(X(-dc.L / 2)) + "," + f(yq) +
        " " + pts.join(" ") + " " + f(X(dc.L / 2)) + "," + f(yq) + '"/>';
      var pm = dc.presion.puntos.reduce(function (a, p) { return p[1] > a[1] ? p : a; });
      h += '<text x="' + f(X(pm[0]) + (pm[0] > 0 ? -6 : 6)) + '" y="' + f(yq + hq + 16) + '" text-anchor="' +
        (pm[0] > 0 ? "end" : "start") + '">' + n2(dc.presion.qmax, 3) + " kgf/cm²</text>";
    }
    /* las cotas de la sección */
    h += '<text x="' + f(X(0)) + '" y="' + f(Y(-dc.sobre) - (dc.placa ? Math.max(dc.placa.t * k, 3) + 18 : 8)) +
      '" text-anchor="middle">L = ' + n2(dc.L, 0) +
      " cm · h = " + n2(dc.h, 0) + " cm</text>";
    h += '<text x="' + f(X(dc.L / 2 + 8)) + '" y="' + f(Y(0) - 7) + '">terreno</text>';
    h += '<text x="' + f(X(dc.L / 2 + 8)) + '" y="' + f(Y(dc.Df) - 4) + '">Df = ' + n2(dc.Df, 0) + "</text>";
    /* la planta */
    var px = m + dc.L * k + gap, py = Y(dc.Df - dc.h) - (dc.B * k - dc.h * k) / 2;
    if (py < m) py = m;
    h += '<rect class="conc" x="' + f(px) + '" y="' + f(py) + '" width="' + f(dc.L * k) + '" height="' + f(dc.B * k) + '"/>';
    var r = dc.rec * k;
    for (var i = 0; i < dc.barrasL; i++) {          /* las de L van a lo largo de L, repartidas en B */
      var yy = py + r + (dc.B * k - 2 * r) * (dc.barrasL > 1 ? i / (dc.barrasL - 1) : 0.5);
      h += '<line class="barra fina" x1="' + f(px + r) + '" y1="' + f(yy) + '" x2="' + f(px + dc.L * k - r) +
        '" y2="' + f(yy) + '"/>';
    }
    for (var j = 0; j < dc.barrasB; j++) {
      var xx = px + r + (dc.L * k - 2 * r) * (dc.barrasB > 1 ? j / (dc.barrasB - 1) : 0.5);
      h += '<line class="barra fina" x1="' + f(xx) + '" y1="' + f(py + r) + '" x2="' + f(xx) + '" y2="' +
        f(py + dc.B * k - r) + '"/>';
    }
    h += '<rect class="ped" x="' + f(px + (dc.L - dc.pedL) / 2 * k) + '" y="' + f(py + (dc.B - dc.pedB) / 2 * k) +
      '" width="' + f(dc.pedL * k) + '" height="' + f(dc.pedB * k) + '"/>';
    var cx = px + dc.L * k / 2, cy = py + dc.B * k / 2;
    if (dc.placa) {
      h += '<rect class="placa planta" x="' + f(cx - dc.placa.N / 2 * k) + '" y="' + f(cy - dc.placa.B / 2 * k) +
        '" width="' + f(dc.placa.N * k) + '" height="' + f(dc.placa.B * k) + '"/>';
    }
    if (dc.pedestal) {
      var ax = dc.pedL / 2 - dc.pedestal.aEje, ay = dc.pedB / 2 - dc.pedestal.aEje, rb = 2.6;
      for (var ib = 0; ib < dc.pedestal.nb; ib++) {
        var yy2 = -ay + 2 * ay * (dc.pedestal.nb > 1 ? ib / (dc.pedestal.nb - 1) : 0.5);
        [-1, 1].forEach(function (sg) {
          h += '<circle class="punto" cx="' + f(cx + sg * ax * k) + '" cy="' + f(cy + yy2 * k) + '" r="' + rb + '"/>';
        });
      }
      for (var js = 1; js <= dc.pedestal.ns; js++) {
        var xx2 = -ax + 2 * ax * js / (dc.pedestal.ns + 1);
        [-1, 1].forEach(function (sg) {
          h += '<circle class="punto" cx="' + f(cx + xx2 * k) + '" cy="' + f(cy + sg * ay * k) + '" r="' + rb + '"/>';
        });
      }
    }
    if (dc.placa) {
      for (var ip = 0; ip < dc.placa.n; ip++) {
        var yp = (ip - (dc.placa.n - 1) / 2) * dc.placa.sep;
        [-1, 1].forEach(function (sg) {
          h += '<circle class="perno" cx="' + f(cx + sg * dc.placa.f * k) + '" cy="' + f(cy + yp * k) + '" r="4"/>';
        });
      }
    }
    h += '<text x="' + f(px + dc.L * k / 2) + '" y="' + f(py - 8) + '" text-anchor="middle">planta · B = ' +
      n2(dc.B, 0) + " cm</text>";
    return h + "</svg>";
  }

  function pintaCimentacion(fallo) {
    if (RESULTADOS.TIPOS_ZAPATA.indexOf(porticoSel) < 0) porticoSel = "interior";
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Cimentación</h2>' + selZapata() + '<p class="lead">el galpón no ' +
        "se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var c = cimenActual();
    if (!c.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>Cimentación</h2>' + selZapata() + '<p class="lead">todavía no se ' +
        "puede diseñar: falta lo que sigue</p>" + listaFaltas(c.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">La zapata se dimensiona dos veces con la misma ' +
        "pieza: el área con las cargas de servicio contra el suelo, y el concreto con las " +
        "amplificadas de la E.060. Le llegan los casos del análisis, no sus combinaciones.</p>";
      return;
    }
    var z = c.z, dc = RESULTADOS.dibujoCimentacion(c);
    var ley = '<div class="ley"><span><i style="border-top-color:var(--aviso)"></i>presión de servicio · ' +
      esc(dc.presion.combo) + " · base " + esc(dc.presion.base) + " · " + esc(dc.presion.forma || "—") + "</span>" +
      '<span><i style="border-top-color:var(--acero)"></i>acero de refuerzo</span>' +
      '<span><i style="border-top-color:var(--tinta)"></i>pernos de anclaje</span></div>';
    $("centro").innerHTML = '<div class="hoja"><h2>Cimentación</h2>' + selZapata() + '<p class="lead">' +
      "zapata del " + NOMBRE_ZAPATA[c.tipo] + (c.conCruz ? " · con la cruz de fachada" : "") + " · " +
      n2(z.zapata.B_cm, 0) + " × " + n2(z.zapata.L_cm, 0) + " × " + n2(z.zapata.h_cm, 0) + " cm · " +
      (z.auto ? "las medidas mínimas que cumplen" : "las medidas dadas") + " · " +
      (z.cumple ? "cumple" : "NO cumple: " + esc(z.fallas.join(", "))) + "</p>" + svgCimen(dc) + ley +
      '<div class="tarj"><h4>Lo que esta cimentación todavía no cubre</h4>' +
      z.avisos.map(function (x) { return '<p class="pie">' + esc(x) + "</p>"; }).join("") + "</div></div>";
    $("derecha").innerHTML = c.fichas.map(pintaFicha).join("");
  }

  /* ---------- A LO LARGO · el sistema longitudinal ----------
     El galpón visto en planta: los pórticos, las líneas de correa, los paños
     arriostrados de techo y de fachada y las columnas hastiales, con la cadena
     de fuerzas al lado. En Diseño, cada pieza con su ratio. */
  var largoCache = { clave: null, res: null };
  function largoActual() {
    var k = claveAnalisis() + JSON.stringify(modelo.diseno || {});
    if (largoCache.clave !== k) {
      largoCache = { clave: k, res: RESULTADOS.longitudinal(m3, modelo, PERFILES,
        analisisActual("interior"), analisisActual("fachada")) };
    }
    return largoCache.res;
  }

  function svgLargo(lo) {
    var g = lo.lg.geometria, W = 1000, m = 70;
    var largo = m3.ejes.largo_m, luz = g.luz_m;
    var k = (W - 2 * m) / largo, H = luz * k + 2 * m + 30;
    var f = function (x) { return x.toFixed(1); };
    var X = function (z) { return m + z * k; }, Y = function (x) { return m + (luz - x) * k; };
    var h = '<svg class="lg" viewBox="0 0 ' + W + " " + f(H) + '">';
    /* los paños arriostrados de techo, con su celosía */
    var sup = m3.tijeral.nudos.filter(function (n) { return n.clase === "superior"; })
      .map(function (n) { return n.x_m; }).sort(function (a, b) { return a - b; });
    g.panosTecho.forEach(function (pn) {
      var z0 = pn * g.sep_m, z1 = z0 + g.sep_m;
      h += '<rect class="pano" x="' + f(X(z0)) + '" y="' + f(Y(luz)) + '" width="' + f(g.sep_m * k) + '" height="' + f(luz * k) + '"/>';
      for (var q = 0; q + 1 < sup.length; q++) {
        var a = q % 2 === 0;
        h += '<line class="diag" x1="' + f(X(z0)) + '" y1="' + f(Y(a ? sup[q] : sup[q + 1])) + '" x2="' + f(X(z1)) +
          '" y2="' + f(Y(a ? sup[q + 1] : sup[q])) + '"/>';
      }
    });
    /* las correas */
    sup.forEach(function (x) {
      h += '<line class="correa" x1="' + f(X(0)) + '" y1="' + f(Y(x)) + '" x2="' + f(X(largo)) + '" y2="' + f(Y(x)) + '"/>';
    });
    /* los pórticos */
    m3.ejes.z_m.forEach(function (z, e) {
      var ext = e === 0 || e === m3.ejes.porticos - 1;
      h += '<line class="portico' + (ext ? " ext" : "") + '" x1="' + f(X(z)) + '" y1="' + f(Y(luz)) + '" x2="' + f(X(z)) +
        '" y2="' + f(Y(0)) + '"/>';
    });
    /* las cruces de fachada, en los dos aleros */
    g.panosFachada.forEach(function (pn) {
      var z0 = pn * g.sep_m, z1 = z0 + g.sep_m;
      [[0, 1], [luz, -1]].forEach(function (c) {
        var y = Y(c[0]), d = c[1] * 18;
        h += '<path class="cruz" d="M' + f(X(z0)) + " " + f(y) + "L" + f(X(z1)) + " " + f(y + d) + "M" + f(X(z0)) + " " +
          f(y + d) + "L" + f(X(z1)) + " " + f(y) + '"/>';
      });
    });
    /* las columnas hastiales, en los dos extremos */
    g.lineas.forEach(function (L) {
      [0, largo].forEach(function (z) {
        h += '<circle class="' + (L.tipo === "hastial" ? "hastial" : "esquina") + '" cx="' + f(X(z)) + '" cy="' + f(Y(L.x)) +
          '" r="' + (L.tipo === "hastial" ? 5 : 6) + '"/>';
      });
    });
    /* el viento a lo largo */
    var ya = Y(luz / 2);
    h += '<path class="flecha" d="M' + f(X(0) - 58) + " " + f(ya) + "h40m-8 -6l8 6l-8 6\"/>";
    h += '<text x="' + f(X(0) - 60) + '" y="' + f(ya - 12) + '">viento</text>';
    h += '<text x="' + f(X(largo / 2)) + '" y="' + f(Y(0) + 52) + '" text-anchor="middle">planta del techo · largo ' +
      n2(largo, 0) + " m · luz " + n2(luz, 0) + " m</text>";
    return h + "</svg>";
  }

  function pintaLongitudinal(paso, fallo) {
    var titulo = paso === "analisis" ? "Análisis" : "Diseño";
    var selL = function () { return selPortico(true, paso === "diseno"); };
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>' + titulo + "</h2>" + selL() + '<p class="lead">el galpón ' +
        "no se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var lo = largoActual();
    if (!lo.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>' + titulo + "</h2>" + selL() + '<p class="lead">todavía ' +
        "no se puede ver a lo largo: falta lo que sigue</p>" + listaFaltas(lo.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">A lo largo el galpón no tiene pórtico: el viento de los hastiales y el ' +
        "sismo longitudinal bajan por las columnas hastiales, el arriostre vertical, las correas, el arriostre de " +
        "techo y la cruz de fachada.</p>";
      return;
    }
    var t = function (x) { return n2(x / 1000, 2); };
    if (paso === "analisis") {
      var filas = lo.cadena.map(function (x) {
        return "<tr><td>" + esc(x.que) + "</td><td>" + (x.valor_kgfm !== undefined ? t(x.valor_kgfm) + " t·m" : t(x.valor_kgf) + " t") +
          "</td><td>" + esc(x.estado || "—") + "</td><td>" + fuenteBtn(x.fuente) + "</td></tr>";
      }).join("");
      $("centro").innerHTML = '<div class="hoja"><h2>Análisis</h2>' + selPortico(true) + '<p class="lead">a lo largo · ' +
        "del hastial al suelo · fuerzas factorizadas, la mayor de 1,3·W y 1,0·E</p>" + svgLargo(lo) +
        '<div class="ley"><span><i style="border-top-color:var(--aviso)"></i>arriostre de techo y cruces de fachada</span>' +
        '<span><i style="border-top-color:var(--tinta)"></i>pórticos (los extremos, gruesos)</span>' +
        '<span><i style="border-top-color:var(--suave)"></i>correas</span><span>● columnas hastiales</span></div>' +
        '<h3>La cadena</h3><div class="tarj"><div class="rueda-x"><table class="rx"><thead><tr><th>eslabón</th>' +
        "<th>fuerza</th><th>estado</th><th></th></tr></thead><tbody>" + filas + "</tbody></table></div>" +
        lo.lg.avisos.map(function (x) { return '<p class="pie">' + esc(x) + "</p>"; }).join("") + "</div></div>";
      $("derecha").innerHTML = lo.fichas.map(pintaFicha).join("");
      return;
    }
    /* Diseño */
    if (!lo.diseno) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selL() + '<p class="lead">todavía no se ' +
        "puede verificar a lo largo: falta lo que sigue</p>" + listaFaltas(lo.faltasDiseno, true) + "</div>";
      $("derecha").innerHTML = "";
      return;
    }
    var D = lo.diseno;
    var piezas = D.piezas.map(function (x) {
      var cls = x.faltanEsenciales || !x.cumple ? "neg" : "";
      var falta = (x.omitidos || []).filter(function (o) { return o.esencial; })[0];
      return "<tr><td>" + esc(x.pieza) + "</td><td>" + esc(x.perfil || "—") + '</td><td class="' + cls + '">' +
        (x.ratio === null || x.ratio === undefined ? "—" : n2(x.ratio, 2)) + (x.faltanEsenciales ? " ?" : "") + "</td><td>" +
        esc(falta ? "FALTA · " + falta.motivo : (x.falla || x.estado || "")) + "</td></tr>";
    }).join("");
    $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selL() + '<p class="lead">a lo largo · ' +
      D.resumen.cumplen + " de " + D.resumen.total + " piezas cumplen</p>" +
      '<div class="tarj"><div class="rueda-x"><table class="rx lgp"><thead><tr><th>pieza</th><th>perfil</th>' +
      "<th>ratio</th><th>lo que manda</th></tr></thead><tbody>" + piezas + "</tbody></table></div>" +
      '<p class="pie">Cada pieza con la mayor fuerza de su clase y el perfil de la clase. El perfil se cambia en la ' +
      "tabla de Geometría; los tirantes se hacen con varilla (familia VAR).</p></div></div>";
    $("derecha").innerHTML = lo.fichas.map(pintaFicha).join("");
  }

  /* ---------- LAS CORREAS ----------
     El faldón en sección con cada correa pintada por su ratio, y una tabla
     línea por línea. Las de puntal llevan la axial del sistema a lo largo. */
  var correasCache = { clave: null, res: null };
  function correasActual() {
    var k = claveAnalisis() + JSON.stringify(modelo.diseno || {});
    if (correasCache.clave !== k) {
      correasCache = { clave: k, res: RESULTADOS.correas(m3, modelo, PERFILES,
        analisisActual("interior"), analisisActual("fachada")) };
    }
    return correasCache.res;
  }

  function svgCorreas(v) {
    var sup = m3.tijeral.nudos.filter(function (n) { return n.clase === "superior"; })
      .sort(function (a, b) { return a.x_m - b.x_m; });
    var W = 1000, m = 50, luz = m3.luz_m;
    var ys = sup.map(function (n) { return n.y_m; });
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var k = (W - 2 * m) / luz, H = (y1 - y0) * k + 2 * m + 40;
    var f = function (x) { return x.toFixed(1); };
    var X = function (x) { return m + x * k; }, Y = function (y) { return H - m - 20 - (y - y0) * k; };
    var h = '<svg class="cr" viewBox="0 0 ' + W + " " + f(H) + '">';
    h += '<polyline class="faldon" points="' + sup.map(function (n) { return f(X(n.x_m)) + "," + f(Y(n.y_m)); }).join(" ") + '"/>';
    v.lineas.forEach(function (l, i) {
      var n = sup[i], cls = l.faltanEsenciales ? "falta" : (l.cumple ? "ok" : "no");
      h += '<rect class="' + cls + '" x="' + f(X(n.x_m) - 7) + '" y="' + f(Y(n.y_m) - 16) + '" width="14" height="16" rx="2"/>';
      if (l.puntal) h += '<circle class="pt" cx="' + f(X(n.x_m)) + '" cy="' + f(Y(n.y_m) - 24) + '" r="3"/>';
      h += '<text x="' + f(X(n.x_m)) + '" y="' + f(Y(n.y_m) + 18) + '" text-anchor="middle">' +
        (l.ratio === null ? "?" : n2(l.ratio, 2)) + "</text>";
    });
    return h + "</svg>";
  }

  function pintaCorreas(fallo) {
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">el galpón no ' +
        "se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var v = correasActual();
    if (!v.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">todavía no se ' +
        "pueden verificar las correas: falta lo que sigue</p>" + listaFaltas(v.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">Cada línea de correa con su parte de techo, su viento y, si hace de ' +
        "puntal, la axial del sistema a lo largo.</p>";
      return;
    }
    if (v.omitida) {
      $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">las correas ' +
        "no se verifican</p>" + '<ol class="avisos"><li class="error"><span class="niv">falta</span><b>' + esc(v.omitida.que) +
        "</b><p>" + esc(v.omitida.motivo) + "</p></li></ol></div>";
      $("derecha").innerHTML = v.fichas.map(pintaFicha).join("");
      return;
    }
    var cumplen = v.lineas.filter(function (l) { return l.cumple; }).length;
    var filas = v.lineas.map(function (l) {
      var falta = (l.omitidos || []).filter(function (o) { return o.esencial; })[0];
      return "<tr><td>" + l.q + "</td><td>" + n2(l.x_m, 2) + "</td><td>" + esc(l.tipo) + "</td><td>" + n2(l.ancho_m, 2) +
        '</td><td class="' + (l.cumple ? "" : "neg") + '">' + (l.ratio === null ? "—" : n2(l.ratio, 2)) + "</td><td>" +
        (l.puntal ? n2(l.Nmax_kgf / 1000, 2) + " t" : "—") + "</td><td>" + esc(l.combo || "") + "</td><td>" +
        esc(falta ? "FALTA · " + falta.motivo : (l.estado || "")) + "</td></tr>";
    }).join("");
    $("centro").innerHTML = '<div class="hoja"><h2>Diseño</h2>' + selPortico(true, true) + '<p class="lead">correas · ' +
      esc(v.perfil) + " · " + cumplen + " de " + v.lineas.length + " líneas cumplen</p>" + svgCorreas(v) +
      '<div class="ley"><span><i style="border-top-color:var(--ok)"></i>cumple</span>' +
      '<span><i style="border-top-color:var(--alerta)"></i>no cumple</span><span>● hace de puntal</span>' +
      "<span>sección del techo, en el plano del pórtico</span></div>" +
      '<div class="tarj"><div class="rueda-x"><table class="rx lgp"><thead><tr><th>línea</th><th>x (m)</th><th>tipo</th>' +
      "<th>ancho (m)</th><th>ratio</th><th>axial</th><th>combinación</th><th>lo que manda</th></tr></thead><tbody>" + filas +
      "</tbody></table></div>" + '<p class="pie">Simplemente apoyadas entre pórticos (fila CR.simple). Las de puntal, con ' +
      "la axial del sistema a lo largo en el mismo estado (fila CR.combinaciones).</p></div></div>";
    $("derecha").innerHTML = v.fichas.map(pintaFicha).join("");
  }

  /* ---------- CONEXIONES · las barras del tijeral a sus cartelas ----------
     Un pórtico a la vez, como Análisis. Cada clase con la mayor fuerza de sus
     barras (las bridas, la diferencia de sus tramos en un nudo). */
  var conexCache = {};
  function conexActual(p) {
    p = p || porticoMarco();
    var k = claveAnalisis() + JSON.stringify(modelo.diseno || {}), c = conexCache[p];
    if (!c || c.clave !== k) {
      c = conexCache[p] = { clave: k, res: RESULTADOS.conexiones(m3, modelo, PERFILES, analisisActual(p), p) };
    }
    return c.res;
  }

  function pintaConexiones(fallo) {
    if (RESULTADOS.PORTICOS.indexOf(porticoSel) < 0) porticoSel = "interior";
    if (!m3) {
      $("centro").innerHTML = '<div class="hoja"><h2>Conexiones</h2>' + selPortico(false, false) + '<p class="lead">el ' +
        "galpón no se puede montar: " + esc(fallo ? fallo.titulo : "—") + ". Se corrige en Geometría.</p></div>";
      $("derecha").innerHTML = "";
      return;
    }
    var cx = conexActual();
    if (!cx.ok) {
      $("centro").innerHTML = '<div class="hoja"><h2>Conexiones</h2>' + selPortico(false, false) + '<p class="lead">' +
        "todavía no se pueden verificar las uniones: falta lo que sigue</p>" + listaFaltas(cx.faltas, true) + "</div>";
      $("derecha").innerHTML = '<p class="nohay">Cada barra del tijeral se une a su cartela con la mayor fuerza de su ' +
        "clase: la soldadura o los pernos, el bloque de cortante y la sección de Whitmore (AISC 360-22 Cap. J).</p>";
      return;
    }
    var cumplen = cx.filas.filter(function (f) { return f.cumple; }).length;
    var filas = cx.filas.map(function (f) {
      var falta = (f.omitidos || []).filter(function (o) { return o.esencial; })[0];
      var nota = f.ratio === null ? "FALTA · " + f.falta : (falta ? "FALTA · " + falta.que + ": " + falta.motivo :
        (f.omitidos || []).map(function (o) { return "sin " + o.que; }).join(" · "));
      return "<tr><td>" + esc(f.clase) + "</td><td>" + esc(f.perfil || "—") + "</td><td>" +
        (f.Nt_kgf > 0 ? n2(f.Nt_kgf / 1000, 2) : "—") + "</td><td>" + (f.Nc_kgf > 0 ? n2(f.Nc_kgf / 1000, 2) : "—") +
        '</td><td class="' + (f.cumple ? "" : "neg") + '">' + (f.ratio === null ? "—" : n2(f.ratio, 2)) +
        (f.faltanEsenciales ? " ?" : "") + '</td><td class="tx">' + esc(f.gobierna || "") + "</td><td>" + esc(nota) + "</td></tr>";
    }).join("");
    $("centro").innerHTML = '<div class="hoja"><h2>Conexiones</h2>' + selPortico(false, false) + '<p class="lead">' +
      cumplen + " de " + cx.filas.length + " uniones del tijeral cumplen · " +
      (cx.r.fachada ? "pórtico de fachada" : "pórtico interior") + " · " + esc(cx.union) + "</p>" +
      '<h3>Cada clase a su cartela</h3><div class="tarj"><div class="rueda-x"><table class="rx lgp"><thead><tr>' +
      "<th>clase</th><th>perfil</th><th>tracción (t)</th><th>compresión (t)</th><th>ratio</th><th class=\"tx\">gobierna</th>" +
      "<th>lo que no se verifica</th></tr></thead><tbody>" + filas + "</tbody></table></div>" +
      '<p class="pie">Las diagonales y los montantes, con la mayor fuerza de su clase; las bridas pasan corridas y a la ' +
      "cartela llega la diferencia entre sus dos tramos (fila J.union.angulo). Las uniones y la cartela se cambian en " +
      "el panel de la izquierda, en «Tijeral».</p></div></div>";
    $("derecha").innerHTML = cx.fichas.map(pintaFicha).join("");
  }

  /* ---------- DATOS · el proyecto, y lo que falta en cada paso ----------
     Cada dato que falta aparece UNA vez, en el paso donde se pide, con el
     botón para ir allí. Un paso que depende de otro sin terminar dice a cuál espera. */
  function pintaDatos(fallo) {
    var est = RESULTADOS.pendientes({ m3: m3, fallo: fallo, modelo: modelo, perfiles: PERFILES,
      analisis: m3 ? analisisActual("interior") : null });
    var hechos = est.filter(function (p) { return p.completo; }).length;
    var filas = est.map(function (p) {
      var cuerpo = p.completo ? '<span class="st-escrita">completo</span>'
        : (p.faltas.length ? "<ul>" + p.faltas.map(function (f) { return "<li>falta " + esc(f.que) + "</li>"; }).join("") + "</ul>" : "") +
          (p.espera.length ? '<p class="pie">espera a ' + p.espera.map(function (x) { return esc(x.nombre); }).join(" y ") + "</p>" : "");
      return '<div class="tarj paso-est' + (p.completo ? " ok" : "") + '"><h4>' + esc(p.nombre) + "</h4>" + cuerpo +
        (!p.completo && p.paso !== "datos" ? '<button class="ir" data-ir="' + p.paso + '">ir a ' + esc(p.nombre) + "</button>" : "") +
        "</div>";
    }).join("");
    $("centro").innerHTML = '<div class="hoja"><h2>Datos</h2><p class="lead">' +
      esc((modelo.proyecto && modelo.proyecto.nombre) || "proyecto sin nombre") + " · " + hechos + " de " + est.length +
      " pasos completos · los datos, arriba, en tres pestañas; lo que sale de ellos, en la misma tarjeta</p>" +
      "<h3>Lo que falta, paso por paso</h3><div class=\"rejilla\">" + filas + "</div></div>";
    pintaFijos();
    var mat = RESULTADOS.materiales(modelo).map(function (x) {
      return '<div class="ln"><span class="q">' + esc(x.que) + '</span><span class="v">' +
        (x.v ? esc(x.v) : "se elige en " + esc(VISTAS.paso(x.paso).nombre)) + "</span></div>";
    }).join("");
    var nor = RESULTADOS.NORMAS.map(function (x) {
      return '<div class="nor"><b>' + esc(x[0]) + "</b> · " + esc(x[1]) + "</div>";
    }).join("");
